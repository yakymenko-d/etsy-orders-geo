<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта замовлень Etsy</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff9a3c'/%3E%3Cstop offset='1' stop-color='%23f1641e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 53s15-13.2 15-24.5a15 15 0 0 0-30 0C17 39.8 32 53 32 53z' fill='%23fff'/%3E%3Ccircle cx='32' cy='28.5' r='6' fill='%23f1641e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<style>
  :root {
    --glass:rgba(255,255,255,.84); --solid:#fff; --fg:#1c1b1a; --muted:#6b6560; --line:rgba(0,0,0,.09); --hover:rgba(0,0,0,.05);
    --accent:#f1641e; --accent2:#ff9a3c; --accent-soft:rgba(241,100,30,.13); --danger:#e5484d; --good:#1a9850;
    --shadow:0 8px 30px rgba(20,16,12,.16), 0 1px 3px rgba(20,16,12,.1);
    --r:18px; --mapbg:#e8e4de;
  }
  :root[data-theme="dark"] {
    --glass:rgba(34,32,31,.82); --solid:#262423; --fg:#f4efe9; --muted:#a49c94; --line:rgba(255,255,255,.1); --hover:rgba(255,255,255,.07);
    --accent-soft:rgba(255,128,60,.2); --good:#4cc38a; --danger:#ff6b6f;
    --shadow:0 10px 36px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.4); --mapbg:#1b1b1d;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--mapbg); font:14px/1.45 ui-sans-serif,-apple-system,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif; color:var(--fg); -webkit-font-smoothing:antialiased; overflow:hidden; }
  #map { position:absolute; inset:0; background:var(--mapbg); }
  .leaflet-tooltip { background:var(--solid); color:var(--fg); border-color:var(--line); box-shadow:var(--shadow); }
  .leaflet-tooltip-top:before { border-top-color:var(--solid); }
  .leaflet-tooltip-bottom:before { border-bottom-color:var(--solid); }
  .leaflet-tooltip-left:before { border-left-color:var(--solid); }
  .leaflet-tooltip-right:before { border-right-color:var(--solid); }
  .glass { background:var(--glass); backdrop-filter:blur(18px) saturate(1.5); -webkit-backdrop-filter:blur(18px) saturate(1.5); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); }
  button { font:inherit; color:inherit; }
  .ib { border:0; background:transparent; width:32px; height:32px; border-radius:10px; cursor:pointer; display:grid; place-items:center; color:var(--muted); font-size:15px; flex:none; transition:background .15s, color .15s; }
  .ib:hover { background:var(--hover); color:var(--fg); }
  .ib.off { opacity:.4; }
  .ib.on { background:var(--accent-soft); color:var(--accent); }

  /* ---------- left column ---------- */
  #left { position:absolute; top:14px; left:14px; z-index:1000; width:min(372px, calc(100vw - 28px)); max-height:calc(100% - 150px); display:flex; flex-direction:column; gap:10px; pointer-events:none; }
  #left > * { pointer-events:auto; }
  #shopsCard { padding:10px 8px 8px; flex:none; }
  .sh-head { display:flex; align-items:center; padding:2px 4px 6px 8px; gap:8px; }
  #collapseShops svg { transition:transform .2s; }
  #shopsCard.collapsed #collapseShops svg { transform:rotate(180deg); }
  #shopsCard.collapsed #shopList, #shopsCard.collapsed #addShop { display:none; }
  #shopsCard.collapsed .sh-head { padding-bottom:2px; }
  #miniShops { display:none; align-items:center; }
  #shopsCard.collapsed #miniShops { display:flex; }
  #miniShops .av { width:24px; height:24px; border-radius:8px; font-size:12px; box-shadow:none; border:2px solid var(--solid); margin-left:-7px; }
  #miniShops .av:first-child { margin-left:0; }
  #miniShops .av.off { opacity:.35; }
  /* blur shop names and logos, e.g. for screenshots */
  body.blurnames .shop .n, body.blurnames .shop .av, body.blurnames #miniShops .av, body.blurnames .m-shop { filter:blur(6px); user-select:none; }
  .sh-head b { font-size:15px; letter-spacing:-.01em; }
  #viewerLink { display:none; font-size:13px; font-weight:600; color:var(--accent); text-decoration:none; white-space:nowrap; }
  #shopList { max-height:236px; overflow:auto; display:flex; flex-direction:column; gap:2px; }
  .shop { display:flex; align-items:center; gap:10px; padding:7px 6px 7px 8px; border-radius:13px; cursor:pointer; border:1.5px solid transparent; }
  .shop:hover { background:var(--hover); }
  .shop.active { border-color:var(--c); background:color-mix(in srgb, var(--c) 10%, transparent); }
  .av { width:38px; height:38px; border-radius:12px; flex:none; object-fit:cover; background:var(--c); color:#fff; display:grid; place-items:center; font-weight:800; font-size:18px; box-shadow:0 3px 10px color-mix(in srgb, var(--c) 45%, transparent); }
  .shop .t { flex:1; min-width:0; }
  .shop .n { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.01em; }
  .shop .s { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .shop .dotc { width:9px; height:9px; border-radius:50%; background:var(--c); display:inline-block; margin-right:5px; }
  .shop .acts { display:flex; gap:0; flex:none; }
  .shop .acts .ib { width:30px; height:30px; }
  .shop .acts .ib:hover { color:var(--c); }

  #kpis { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; flex:none; }
  .neg { color:var(--danger) !important; }
  .pos { color:var(--good) !important; }
  .kpi { padding:10px 6px; text-align:center; border-radius:14px; min-width:0; cursor:pointer; transition:transform .15s, border-color .15s; }
  .kpi:hover { transform:translateY(-1px); border-color:var(--accent); }
  .kpi.on { border-color:var(--accent); box-shadow:0 0 0 1.5px var(--accent), var(--shadow); }
  .kpi b { display:block; font-size:17px; letter-spacing:-.02em; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kpi span { display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kpi i { display:none; font-style:normal; font-size:11px; font-weight:700; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kpi i.show { display:block; }
  .kpi i.up { color:var(--good); } .kpi i.down { color:var(--danger); } .kpi i.flat { color:var(--muted); }

  #search { display:flex; align-items:center; gap:8px; padding:6px 6px 6px 14px; flex:none; }
  #search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--fg); font-size:15px; padding:8px 0; }
  #search input::placeholder { color:var(--muted); }
  #toggleFilters { position:relative; }
  #toggleFilters.active::after { content:""; position:absolute; top:5px; right:5px; width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--solid); }
  #filtersCard { padding:14px; overflow:auto; display:none; min-height:0; }
  #filtersCard.open { display:block; }
  #customRange input { flex:1; min-width:0; padding:7px 9px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--fg); font:inherit; font-size:13px; }
  .lbl { font-size:11px; color:var(--muted); margin:14px 0 8px; text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
  .lbl:first-child { margin-top:0; }
  .hint { font-size:12px; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:transparent; padding:5px 12px; border-radius:99px; cursor:pointer; font-size:13px; transition:all .15s; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip:hover { background:var(--hover); }
  .chip.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .chip small { opacity:.65; margin-left:5px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .link { border:0; background:none; color:var(--accent); cursor:pointer; padding:0; font-weight:600; font-size:13px; }
  .link.danger { color:var(--danger); }
  .file-row { display:flex; gap:8px; flex-wrap:nowrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  #uploadBtn { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #clear { flex:none; white-space:nowrap; }
  .btn { border:1px solid var(--line); background:transparent; padding:7px 13px; border-radius:11px; cursor:pointer; font-size:13px; font-weight:550; transition:background .15s; }
  .btn:hover { background:var(--hover); }
  .btn.primary { background:linear-gradient(135deg,var(--accent2),var(--accent)); border:0; color:#fff; }

  /* ---------- top right ---------- */
  #topright { position:absolute; top:14px; right:14px; z-index:1000; display:flex; gap:8px; align-items:flex-start; }
  #topright > .glass { display:flex; padding:4px; border-radius:14px; gap:2px; }
  #view button { border:0; background:transparent; padding:0 14px; height:34px; border-radius:10px; cursor:pointer; font-weight:600; font-size:13px; color:var(--muted); }
  #view button.on { background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff; }
  #topright .ib { width:34px; height:34px; }
  #exportWrap { position:relative; }
  #exportMenu { position:absolute; right:0; top:44px; width:260px; padding:6px; display:none; flex-direction:column; border-radius:14px; }
  #exportMenu.open { display:flex; }
  #exportMenu button { border:0; background:transparent; text-align:left; padding:9px 10px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:550; }
  #exportMenu button:hover { background:var(--hover); }
  #exportMenu small { display:block; color:var(--muted); font-weight:400; }
  #exportMenu hr { border:0; border-top:1px solid var(--line); margin:4px 6px; }

  /* ---------- bottom left: legend + display mode + base layer ---------- */
  #bl { position:absolute; left:14px; bottom:26px; z-index:1000; display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .seg { display:flex; padding:4px; gap:2px; border-radius:14px; }
  .seg button { border:0; background:transparent; padding:7px 11px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap; }
  .seg button.on { background:var(--accent-soft); color:var(--accent); }
  #legend { display:none; padding:8px 12px; border-radius:12px; font-size:12px; color:var(--muted); }
  #legend.show { display:block; }
  #legend .bar { width:180px; height:9px; border-radius:5px; background:linear-gradient(90deg,#fde7d6,#f1641e,#9c2412); margin:5px 0 3px; }

  /* ---------- right sheet (place orders / statistics) ---------- */
  #sheet { position:absolute; z-index:1100; top:66px; right:14px; width:min(430px, calc(100vw - 28px)); max-height:calc(100% - 150px); display:flex; flex-direction:column; overflow:hidden; opacity:0; transform:translateX(24px) scale(.98); pointer-events:none; transition:opacity .22s, transform .22s; border-radius:22px; }
  #sheet.open { opacity:1; transform:none; pointer-events:auto; }
  /* one soft tint across the whole top of the sheet, fading out smoothly below the header and tabs */
  #sheet::before { content:""; position:absolute; left:0; right:0; top:0; height:240px; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, color-mix(in srgb, var(--c) 20%, transparent) 0%, color-mix(in srgb, var(--c) 8%, transparent) 55%, transparent 100%); }
  #sheet > * { position:relative; z-index:1; }
  .m-head { padding:18px 18px 14px; display:flex; gap:12px; align-items:flex-start; flex:none; }
  .m-pin { width:42px; height:42px; border-radius:14px; background:var(--c); color:#fff; display:grid; place-items:center; font-size:20px; flex:none; box-shadow:0 4px 12px color-mix(in srgb, var(--c) 45%, transparent); }
  .m-title { font-size:20px; font-weight:780; letter-spacing:-.02em; line-height:1.2; }
  .m-sub { color:var(--muted); font-size:13px; }
  .m-shop { display:inline-flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; font-weight:650; padding:3px 10px 3px 4px; border-radius:99px; background:color-mix(in srgb, var(--c) 14%, transparent); }
  .m-shop .av { width:18px; height:18px; border-radius:6px; font-size:10px; box-shadow:none; }
  .m-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 18px 14px; flex:none; }
  .m-stat { background:var(--hover); border-radius:12px; padding:8px 10px; min-width:0; }
  .m-stat b { display:block; font-size:15px; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .m-stat span { display:block; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .m-list { overflow:auto; padding:4px 10px 14px; border-top:1px solid var(--line); }
  .m-h { padding:12px 8px 6px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
  .order { display:flex; gap:12px; padding:10px 8px; border-radius:12px; align-items:flex-start; }
  .order:hover { background:var(--hover); }
  .order .ic { width:34px; height:34px; border-radius:10px; background:color-mix(in srgb, var(--c) 16%, transparent); display:grid; place-items:center; flex:none; font-size:15px; }
  .order .mid { flex:1; min-width:0; }
  .order .tt { font-weight:620; overflow-wrap:anywhere; }
  .order .tt a, .rk a { color:inherit; text-decoration:none; border-bottom:1px dotted var(--muted); }
  .order .tt a:hover, .rk a:hover { color:var(--c, var(--accent)); border-bottom-color:var(--c, var(--accent)); }
  .order .mm { color:var(--muted); font-size:12.5px; overflow-wrap:anywhere; }
  .order .pr { font-weight:700; white-space:nowrap; text-align:right; }
  .order .pr small { display:block; color:var(--muted); font-weight:500; font-size:11.5px; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:99px; background:color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); color:var(--c, var(--accent)); margin-left:4px; white-space:nowrap; }
  .empty { color:var(--muted); padding:16px 8px; text-align:center; }

  /* stats */
  .st-body { overflow:auto; padding:0 16px 16px; }
  .st-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .chart { margin-top:16px; }
  .bars { display:flex; align-items:flex-end; gap:2px; height:70px; padding-top:4px; }
  .bars div { flex:1; min-width:3px; background:color-mix(in srgb, var(--muted) 35%, transparent); border-radius:3px 3px 0 0; }
  .bars div.in { background:linear-gradient(180deg,var(--accent2),var(--accent)); }
  #tlBars div { cursor:pointer; transition:background .15s; }
  #tlBars div:hover { outline:2px solid var(--accent); }
  .axis { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:4px; }
  .axis.eq span { flex:1; text-align:center; }
  .grp { display:flex; align-items:flex-end; gap:6px; height:76px; }
  .grp > div { flex:1; display:flex; align-items:flex-end; gap:1px; height:100%; }
  .grp i { flex:1; border-radius:2px 2px 0 0; min-height:1px; }
  .lgd { display:flex; gap:12px; font-size:11.5px; color:var(--muted); margin-top:6px; flex-wrap:wrap; }
  .lgd b { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .tabs { display:flex; flex-wrap:wrap; gap:3px; margin:18px 0 6px; background:var(--hover); padding:3px; border-radius:12px; }
  .tabs button { flex:1 0 auto; border:0; background:transparent; padding:6px 7px; border-radius:9px; cursor:pointer; font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap; }
  .tabs button small { font-size:10.5px; }
  .tabs button.on { background:var(--solid); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .rk { position:relative; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; cursor:pointer; overflow:hidden; margin-bottom:6px; }
  .rk:last-child { margin-bottom:0; }
  .rk:hover { background:var(--hover); }
  .rk.on { outline:2px solid var(--accent); }
  .rk .bar { position:absolute; left:0; top:0; bottom:0; background:var(--accent-soft); border-radius:10px; z-index:-1; }
  .rk .no { width:20px; color:var(--muted); font-size:12px; font-weight:700; flex:none; }
  .rk .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .rk .nm small { color:var(--muted); font-weight:400; margin-left:4px; }
  .rk .vl { font-weight:700; white-space:nowrap; font-size:13px; text-align:right; }
  .rk .vl small { color:var(--muted); font-weight:500; margin-left:6px; }
  .rk-list { position:relative; z-index:0; }
  .tab-note { font-size:12px; color:var(--muted); padding:2px 10px 8px; }

  /* ---------- shop dialog ---------- */
  #dlg { position:absolute; inset:0; z-index:1300; display:none; place-items:center; background:rgba(0,0,0,.35); backdrop-filter:blur(3px); }
  #dlg.open { display:grid; }
  #dlg .box { width:min(400px, calc(100vw - 28px)); max-height:calc(100% - 28px); overflow:auto; padding:22px; background:var(--solid); border-radius:22px; box-shadow:var(--shadow); }
  #dlg h3 { margin:0 0 16px; font-size:18px; }
  #dlg label.f { font-size:12px; color:var(--muted); display:block; margin-bottom:5px; }
  #dlg input[type=text] { width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--fg); font-size:15px; }
  #dlg .logo-row { display:flex; align-items:center; gap:12px; margin:16px 0; }
  #dlg .logo-row .av { width:52px; height:52px; border-radius:16px; font-size:24px; }
  #dlg .hint { margin:5px 0 16px; }
  .swatches { display:flex; gap:8px; margin:6px 0 18px; flex-wrap:wrap; }
  .sw { width:28px; height:28px; border-radius:50%; border:3px solid transparent; background:var(--c); cursor:pointer; outline:1px solid var(--line); }
  .sw.on { border-color:var(--solid); outline:2px solid var(--c); }
  .sw.custom { position:relative; background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); overflow:hidden; display:block; }
  .sw.custom.has { background:var(--c); }
  .sw.custom input { position:absolute; inset:-8px; width:48px; height:48px; opacity:0; cursor:pointer; }
  .sw.custom::after { content:"+"; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.6); pointer-events:none; }
  .sw.custom.has::after { content:"🎨"; font-size:12px; }
  .danger-row { display:flex; gap:16px; padding:12px 0; margin-bottom:12px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }

  #toast { position:absolute; left:50%; bottom:26px; transform:translateX(-50%); z-index:1200; padding:9px 18px; font-size:13px; display:none; border-radius:99px; max-width:min(560px, 90vw); text-align:center; }
  body.drop::after { content:"Відпустіть файл, щоб додати замовлення до вибраного магазину"; position:absolute; inset:0; z-index:2000; display:grid; place-items:center; text-align:center; padding:20px; font-size:22px; font-weight:700; background:rgba(241,100,30,.22); border:4px dashed var(--accent); }

  /* read-only view opened from a shared link */
  body.viewer #addShop, body.viewer .shop .acts [data-a=up], body.viewer .shop .acts [data-a=edit], body.viewer .file-row,
  body.viewer #privacyBtn, body.viewer .own-only { display:none !important; }
  body.viewer #viewerLink { display:inline; }

  /* ---------- leaflet ---------- */
  .leaflet-control-zoom { border:0 !important; box-shadow:var(--shadow) !important; border-radius:14px !important; overflow:hidden; margin:0 14px 26px 0 !important; }
  .leaflet-control-zoom a { background:var(--glass) !important; backdrop-filter:blur(18px); color:var(--fg) !important; border-color:var(--line) !important; width:36px !important; height:36px !important; line-height:36px !important; }
  .leaflet-control-attribution { background:var(--glass) !important; color:var(--muted) !important; border-radius:8px 0 0 0; }
  .leaflet-control-attribution a { color:var(--muted) !important; }
  .pinwrap, .clusterwrap, .originwrap { filter:drop-shadow(0 3px 3px rgba(0,0,0,.35)); transition:transform .15s; }
  .pinwrap { transform-origin:50% 100%; }
  .pinwrap:hover, .clusterwrap:hover { transform:scale(1.1); }
  .pinwrap.sel { transform:scale(1.25); filter:drop-shadow(0 0 8px var(--c)) drop-shadow(0 3px 3px rgba(0,0,0,.4)); z-index:9999 !important; }
  .leaflet-tooltip.origin-tip { font-weight:650; border-radius:8px; }

  @media (max-width:700px) {
    #left { top:10px; left:10px; width:calc(100vw - 20px); max-height:calc(100% - 170px); gap:8px; }
    #shopList { max-height:108px; }

<script>
const $ = id => document.getElementById(id);
const ls = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); return true; } catch { return false; } }, del(k){ try { localStorage.removeItem(k); } catch {} } };
let toastTimer; const toast = (t, ms) => { const el=$('toast'); clearTimeout(toastTimer); if(!t){ el.style.display='none'; return; } el.textContent=t; el.style.display='block'; if(ms) toastTimer=setTimeout(()=>el.style.display='none', ms); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS = ['#f1641e','#2f80ed','#1fa971','#9b51e0','#e5484d','#e0a800','#0fa3b1','#e255a1'];
const isDesktop = () => matchMedia('(min-width:701px)').matches;
let theme = ls.get('etsyTheme2') === 'dark' ? 'dark' : 'light';
document.documentElement.dataset.theme = theme;
let viewOnly = false; // true when the page was opened from a shared read-only link

// ================= storage: IndexedDB (falls back to localStorage) =================
const kv = (() => {
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no indexedDB'));
    const r = indexedDB.open('etsy-orders-map', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('kv', mode), q = fn(t.objectStore('kv')); t.oncomplete = () => res(q.result); t.onerror = t.onabort = () => rej(t.error); }); };
  return {
    async get(k) { try { return await tx('readonly', s => s.get(k)); } catch { try { return JSON.parse(ls.get('kv:'+k)) ?? undefined; } catch { return undefined; } } },
    async set(k, v) { if (viewOnly) return true; try { await tx('readwrite', s => s.put(v, k)); return true; } catch { return ls.set('kv:'+k, JSON.stringify(v)); } },
    async del(k) { if (viewOnly) return; try { await tx('readwrite', s => s.delete(k)); } catch {} ls.del('kv:'+k); },
  };
})();

// ================= shops =================
let shops = [], activeId = null;
const uid = () => 's' + Math.random().toString(36).slice(2,9);
const shopMeta = ({places, loading, ledger, ...m}) => m;
function saveShops() { kv.set('shops', shops.map(shopMeta)); }
async function saveData(s) { if (!await kv.set('data:'+s.id, s.places)) toast('Не вдалося зберегти дані в браузері — після перезавантаження їх треба буде додати знову.', 6000); }
const shopById = id => shops.find(s => s.id===id);
const activeShop = () => shopById(activeId) || shops[0];
const avatarHTML = (s, cls='av') => s.logo ? `<img class="${cls}" style="--c:${s.color}" src="${esc(s.logo)}" alt="">` : `<div class="${cls}" style="--c:${s.color}">${esc((s.name.trim()[0]||'M').toUpperCase())}</div>`;
const nOrders = s => s.places.reduce((n,p)=>n+p.orders.length,0);
const placeKey = l => [l.city,l.state,l.country].map(x => (x||'').trim().toLowerCase()).join('|');

// repeat buyers: every order gets nth (1-based) and of (total orders by that buyer in this shop)
const buyerKey = o => (o.buyer||'').trim().toLowerCase().replace(/\s+/g,' ');
function computeRepeat(shop) {
  const by = new Map();
  shop.places.forEach(p => p.orders.forEach(o => { const k = buyerKey(o); o.nth = 0; o.of = 0; if (k) { if (!by.has(k)) by.set(k, []); by.get(k).push(o); } }));
  by.forEach(list => { list.sort((a,b) => (Date.parse(a.date)||0) - (Date.parse(b.date)||0)); list.forEach((o,i) => { o.nth = i+1; o.of = list.length; }); });
}

const svg = (p, s=17) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const PIN = '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>';
const ICON = {
  up:     svg('<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>'),
  edit:   svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  pin:    svg(PIN),
  pinOff: svg(PIN + '<path d="M3 3l18 18"/>'),
  route:  svg('<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/>'),
  stats:  svg('<path d="M3 21h18"/><path d="M7 17v-6M12 17V5M17 17v-9"/>'),
  lock:   svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  unlock: svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.6-1.8"/>'),
  download: svg('<path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>'),
  sun:    svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon:   svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
  filter: svg('<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>'),
  chevron: svg('<path d="M6 15l6-6 6 6"/>'),
  eye:    svg('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  eyeOff: svg('<path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.8 17.8 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),
};
let blurNames = ls.get('etsyBlurNames') === '1';
function syncBlur() {
  document.body.classList.toggle('blurnames', blurNames);
  $('blurShops').innerHTML = blurNames ? ICON.eyeOff : ICON.eye;
  $('blurShops').classList.toggle('on', blurNames);
  $('blurShops').title = blurNames ? 'Показати назви й логотипи магазинів' : 'Розмити назви й логотипи магазинів (для скріншотів)';
}
$('blurShops').onclick = () => { blurNames = !blurNames; ls.set('etsyBlurNames', blurNames ? '1' : '0'); syncBlur(); if (routesOn) redraw(false); };
syncBlur();
// the shops card can be folded to a single line with small logos (remembered per browser)
function syncShopsCollapse() {
  const c = ls.get('etsyShopsCollapsed') === '1';
  $('shopsCard').classList.toggle('collapsed', c);
  $('collapseShops').innerHTML = ICON.chevron;
  $('collapseShops').title = c ? 'Показати магазини' : 'Сховати магазини';
}
$('collapseShops').onclick = () => { ls.set('etsyShopsCollapsed', ls.get('etsyShopsCollapsed') === '1' ? '0' : '1'); syncShopsCollapse(); };
syncShopsCollapse();

function renderShops() {
  $('miniShops').innerHTML = shops.map(s => avatarHTML(s).replace('class="av"', `class="av${s.visible ? '' : ' off'}" title="${esc(s.name)}"`)).join('');
  const box = $('shopList'); box.innerHTML = '';
  shops.forEach(s => {
    const el = document.createElement('div'); el.className = 'shop'+(s.id===activeId && !viewOnly ?' active':''); el.style.setProperty('--c', s.color);
    const n = nOrders(s);
    el.innerHTML = `${avatarHTML(s)}<div class="t"><div class="n">${esc(s.name)}</div><div class="s">${s.loading ? '⏳ '+esc(s.loading) : n ? `<span class="dotc"></span>${n} замовлень · ${s.places.length} міст${s.ledger?.length ? ' · виписка ✓' : ''}` : 'Немає даних — завантажте CSV'}</div></div>
      <div class="acts"><button class="ib" data-a="up" title="Завантажити замовлення">${ICON.up}</button><button class="ib" data-a="edit" title="Редагувати">${ICON.edit}</button><button class="ib${s.visible?'':' off'}" data-a="eye" title="${s.visible?'Сховати піни магазину':'Показати піни магазину'}">${s.visible?ICON.pin:ICON.pinOff}</button></div>`;
    el.onclick = e => {
      const a = e.target.closest('button')?.dataset.a;
      activeId = s.id;
      if (a==='up') $('file').click();
      else if (a==='edit') openDlg(s);
      else if (a==='eye') { s.visible = !s.visible; saveShops(); if (!s.visible && selected?.shop===s) closeSheet(); refresh(true); }
      renderShops(); syncUploadLabel();
    };
    box.appendChild(el);
  });
}
function syncUploadLabel() { if (activeShop()) $('uploadBtn').textContent = `📂 Завантажити для «${activeShop().name}»`; }
$('uploadBtn').onclick = () => $('file').click();

// ---- add / edit shop dialog ----
let dlgShop = null, draft = {};
function dlgRender() {
  const tmp = { ...draft, name: $('dlgName').value || draft.name };
  $('dlgAv').outerHTML = avatarHTML(tmp).replace('class="av"','class="av" id="dlgAv"');
  const sw = $('swatches'); sw.innerHTML='';
  COLORS.forEach(c => { const b=document.createElement('button'); b.className='sw'+(c===draft.color?' on':''); b.style.setProperty('--c',c); b.onclick=()=>{ draft.color=c; dlgRender(); }; sw.appendChild(b); });
  const custom = !COLORS.includes(draft.color);
  const lab = document.createElement('label'); lab.className = 'sw custom' + (custom ? ' has on' : ''); lab.title = 'Свій колір';
  lab.style.setProperty('--c', draft.color);
  const inp = document.createElement('input'); inp.type = 'color'; inp.value = /^#[0-9a-f]{6}$/i.test(draft.color) ? draft.color : '#f1641e';
  inp.oninput = () => { draft.color = inp.value; lab.style.setProperty('--c', inp.value); lab.classList.add('has','on'); sw.querySelectorAll('button.sw').forEach(x=>x.classList.remove('on')); $('dlgAv').style.setProperty('--c', inp.value); };
  lab.appendChild(inp); sw.appendChild(lab);
  $('dlgFromLogo').style.display = draft.logo ? '' : 'none';
}
// dominant saturated colour of an image — ignores transparent, near-white/black and grey pixels
function dominantColor(src) {
  const s = 40, c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d', { willReadFrequently:true }); x.drawImage(src, 0, 0, s, s);
  const d = x.getImageData(0, 0, s, s).data, B = Array.from({length:12}, () => ({w:0,r:0,g:0,b:0}));
  for (let i = 0; i < d.length; i += 4) {
    if (d[i+3] < 128) continue;
    const r=d[i]/255, g=d[i+1]/255, b=d[i+2]/255, mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, dd=mx-mn;
    if (dd < .08 || l > .93 || l < .07) continue;
    const sat = dd / (1 - Math.abs(2*l - 1));
    if (sat < .3) continue;
    let h = mx===r ? ((g-b)/dd)%6 : mx===g ? (b-r)/dd+2 : (r-g)/dd+4; h = (h*60+360)%360;
    const w = sat * (1 - Math.abs(l - .5)), k = B[Math.floor(h/30)%12];
    k.w += w; k.r += d[i]*w; k.g += d[i+1]*w; k.b += d[i+2]*w;
  }
  const top = B.reduce((a,b) => b.w > a.w ? b : a);
  if (top.w <= 0) return null;
  let r=top.r/top.w/255, g=top.g/top.w/255, b=top.b/top.w/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, t=Math.min(.55, Math.max(.38, l));
  if (t !== l) { const f = t > l ? (t - l) / (1 - l) : (t - l) / l; const mix = v => f > 0 ? v + (1 - v) * f : v * (1 + f); r=mix(r); g=mix(g); b=mix(b); }
  return '#' + [r,g,b].map(v => Math.round(Math.min(1,Math.max(0,v))*255).toString(16).padStart(2,'0')).join('');
}
$('dlgFromLogo').onclick = () => {
  if (!draft.logo) return;
  const img = new Image();
  img.onload = () => { const col = dominantColor(img); if (col) { draft.color = col; dlgRender(); } else toast('На логотипі немає яскравого кольору — оберіть вручну.', 3500); };
  img.src = draft.logo;
};
function confirmBtn(btn, label, action) { btn.onclick = () => { if (btn.dataset.armed) return action(); btn.dataset.armed = '1'; btn.textContent = label; }; }
function openDlg(shop) {
  dlgShop = shop;
  draft = shop ? { name:shop.name, logo:shop.logo, color:shop.color } : { name:'', logo:'', color: COLORS[shops.length % COLORS.length] };
  $('dlgTitle').textContent = shop ? 'Редагувати магазин' : 'Новий магазин';
  $('dlgName').value = draft.name;
  $('dlgOrigin').value = shop?.origin?.q || '';
  $('dlgOriginHint').textContent = shop?.origin ? 'Знайдено на мапі ✓' : 'Необов\'язково. Потрібно для маршрутів і відстаней.';
  $('dlgDanger').style.display = shop ? '' : 'none';
  $('dlgDelete').style.display = shop && shops.length>1 ? '' : 'none';

function arc(a, b) { // gently curved line between two [lat,lng] points, taking the short way around the globe

function pctDelta(cur, prev) {
  if (!prev && !cur) return { t:'', c:'flat' };

  const p = Math.round((cur - prev) / Math.abs(prev) * 100);

}

const monthLabel = k => { const [y,m] = k.split('-'); return `${MONTHS[+m-1]} ${y}`; };

  entries.forEach(e => e.orders.forEach(o => { const t = Date.parse(o.date); if (isNaN(t)) return; const k = monthKey(t); counts.set(k, (counts.get(k)||0)+1); min = Math.min(min, t); max = Math.max(max, t); }));

// ================= loading orders into a shop (merges, no duplicates) =================
const runs = {};
async function loadInto(shop, rows) {
  const run = (runs[shop.id] = (runs[shop.id]||0) + 1);
  if (selected?.shop === shop) closeSheet();
  shop.loading = 'Обробка файлу…'; shop.visible = true; renderShops();
  // 1) rows → orders; rows of the same order (one row per item) are combined
  const incoming = new Map(); let k = 0;
  for (const n of rows.map(normalize)) {
    if (!n.city && !n.country && n.lat == null) continue;
    const key = n.order.id ? 'id:' + n.order.id : 'row:' + (k++);
    const ex = incoming.get(key);
    if (ex) { ex.order.items.push(...n.order.items); ex.order.itemsCount = (ex.order.itemsCount||0) + (n.order.itemsCount||0); if (n.order.itemLevel && n.order.total != null) ex.order.total = (ex.order.total||0) + n.order.total; }
    else incoming.set(key, { loc:n, order:n.order });
  }
  // 2) merge into existing data: same order id → update, same signature without id → skip
  const sig = o => [o.date, o.buyer, o.total].join('|');
  const places = new Map(), byId = new Map(), sigs = new Set();
  shop.places.forEach(p => { p.key ||= placeKey(p); places.set(p.key, p); p.orders.forEach(o => { if (o.id) byId.set(o.id, p); else sigs.add(sig(o)); }); });
  let added = 0, updated = 0, dup = 0;
  for (const { loc, order } of incoming.values()) {
    let pk = placeKey(loc), place = places.get(pk);
    if (!place) { place = { key:pk, city:loc.city, state:loc.state, country:loc.country, lat:loc.lat, lng:loc.lng, orders:[] }; places.set(pk, place); }
    if (order.id && byId.has(order.id)) {
      const old = byId.get(order.id), i = old.orders.findIndex(o => o.id === order.id), merged = mergeOrder(old.orders[i], order);
      if (old === place) old.orders[i] = merged; else { old.orders.splice(i, 1); place.orders.push(merged); byId.set(order.id, place); }
      updated++;
    } else if (!order.id && sigs.has(sig(order))) dup++;
    else { place.orders.push(order); if (order.id) byId.set(order.id, place); added++; }
  }
  shop.places = [...places.values()].filter(p => p.orders.length);
  computeRepeat(shop); refresh(false);
  // 3) geocode new cities
  const todo = shop.places.filter(p => p.lat == null);
  for (let i = 0; i < todo.length; i++) {
    if (runs[shop.id] !== run) return;
    const p = todo[i]; shop.loading = `Шукаю міста на мапі ${i+1}/${todo.length}…`; renderShops();
    const c = await geocode(p); if (c) { p.lat = c[0]; p.lng = c[1]; }
    if (i % 3 === 0 || i === todo.length-1) redraw(false);
  }
  if (runs[shop.id] !== run) return;
  const lost = shop.places.filter(p => p.lat == null); const unplaced = lost.reduce((s,p) => s + p.orders.length, 0);
  shop.places = shop.places.filter(p => p.lat != null);
  computeRepeat(shop); shop.loading = false; await saveData(shop);
  const parts = [`+${added} нових`]; if (updated) parts.push(`${updated} оновлено`); if (dup) parts.push(`${dup} дублів пропущено`); if (unplaced) parts.push(`${unplaced} не знайдено на мапі`);
  toast(`«${shop.name}»: ${parts.join(', ')}.`, 6000);
  renderShops(); refresh(true);
}
async function loadFile(f) {
  if (viewOnly) return;
  const t = await f.text(); let data;
  try { data = f.name.toLowerCase().endsWith('.json') ? JSON.parse(t) : parseCSV(t); } catch (e) { return toast('Не вдалося прочитати файл: ' + e.message, 5000); }
  if (data && !Array.isArray(data) && data.app === BACKUP_APP) return restoreBackup(data);
  if (!Array.isArray(data) || !data.length) return toast('У файлі немає замовлень.', 4000);
  if (isStatement(data)) return loadLedger(activeShop(), data);
  loadInto(activeShop(), data);
}
$('file').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value=''; };
document.body.ondragover = e => { e.preventDefault(); if (!viewOnly) document.body.classList.add('drop'); };
document.body.ondragleave = e => { if (!e.relatedTarget) document.body.classList.remove('drop'); };
document.body.ondrop = e => { e.preventDefault(); document.body.classList.remove('drop'); e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]); };
$('clear').onclick = () => { cache = {}; kv.set('geo', cache); toast('Кеш геокодингу очищено.', 2000); };

// ================= boot =================
(async function boot() {
  const hash = location.hash.startsWith('#v=') ? location.hash.slice(3) : '';
  if (hash) {
    try { await bootViewer(hash); }
    catch { toast('Посилання пошкоджене або обрізане. Попросіть автора надіслати його ще раз.', 8000); viewOnly = true; document.body.classList.add('viewer'); shops = []; }
  } else {
    let meta = await kv.get('shops');
    if (!meta) { // move data from the older localStorage format into IndexedDB
      let old = null; try { old = JSON.parse(ls.get('etsyShops') || 'null'); } catch {}
      if (old?.length) {
        let ok = true;
        for (const s of old) { let d = []; try { d = JSON.parse(ls.get('etsyShopData:'+s.id) || '[]'); } catch {} ok = (await kv.set('data:'+s.id, d)) && ok; }
        try { const g = JSON.parse(ls.get('etsyGeoCache') || 'null'); if (g) ok = (await kv.set('geo', g)) && ok; } catch {}
        ok = (await kv.set('shops', old)) && ok;
        if (ok) ['etsyShops','etsyGeoCache','etsyBrand', ...old.map(s => 'etsyShopData:'+s.id)].forEach(ls.del);
        meta = old;
      }
    }
    if (!meta?.length) {
      let b = {}; try { b = JSON.parse(ls.get('etsyBrand') || '{}'); } catch {}
      meta = [{ id:uid(), name:b.name || 'Мій Etsy-магазин', logo:b.logo || '', color:COLORS[0], visible:true }];
    }
    shops = meta;
    for (const s of shops) { s.places = (await kv.get('data:'+s.id)) || []; s.ledger = (await kv.get('ledger:'+s.id)) || []; s.visible = s.visible !== false; s.loading = false; s.places.forEach(p => p.key ||= placeKey(p)); computeRepeat(s); }
    cache = (await kv.get('geo')) || {};
    activeId = shops[0].id; saveShops();
  }
  if (dispCur && !await loadRates()) { dispCur = ''; }
  syncTopButtons(); renderShops(); syncUploadLabel(); renderRangeUI(); renderCurUI(); refresh(true);
})();
</script>
