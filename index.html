<html lang="uk">
<head>
<meta charset="utf-8">

<title>Карта замовлень Etsy</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff9a3c'/%3E%3Cstop offset='1' stop-color='%23f1641e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 53s15-13.2 15-24.5a15 15 0 0 0-30 0C17 39.8 32 53 32 53z' fill='%23fff'/%3E%3Ccircle cx='32' cy='28.5' r='6' fill='%23f1641e'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<style>
  :root {
    --glass:rgba(255,255,255,.84); --solid:#fff; --fg:#1c1b1a; --muted:#6b6560; --line:rgba(0,0,0,.09); --hover:rgba(0,0,0,.05);
    --accent:#f1641e; --accent2:#ff9a3c; --accent-soft:rgba(241,100,30,.13); --danger:#e5484d; --good:#1a9850;
    --shadow:0 8px 30px rgba(20,16,12,.16), 0 1px 3px rgba(20,16,12,.1);
    --r:18px; --mapbg:#e8e4de;
  }
  :root[data-theme="dark"] {
    --glass:rgba(34,32,31,.82); --solid:#262423; --fg:#f4efe9; --muted:#a49c94; --line:rgba(255,255,255,.1); --hover:rgba(255,255,255,.07);
    --accent-soft:rgba(255,128,60,.2); --good:#4cc38a; --danger:#ff6b6f;
    --shadow:0 10px 36px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.4); --mapbg:#1b1b1d;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--mapbg); font:14px/1.45 ui-sans-serif,-apple-system,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif; color:var(--fg); -webkit-font-smoothing:antialiased; overflow:hidden; }
  #map { position:absolute; inset:0; background:var(--mapbg); }
  .leaflet-tooltip { background:var(--solid); color:var(--fg); border-color:var(--line); box-shadow:var(--shadow); }
  .leaflet-tooltip-top:before { border-top-color:var(--solid); }
  .leaflet-tooltip-bottom:before { border-bottom-color:var(--solid); }
  .leaflet-tooltip-left:before { border-left-color:var(--solid); }
  .leaflet-tooltip-right:before { border-right-color:var(--solid); }
  .glass { background:var(--glass); backdrop-filter:blur(18px) saturate(1.5); -webkit-backdrop-filter:blur(18px) saturate(1.5); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); }
  button { font:inherit; color:inherit; }
  .ib { border:0; background:transparent; width:32px; height:32px; border-radius:10px; cursor:pointer; display:grid; place-items:center; color:var(--muted); font-size:15px; flex:none; transition:background .15s, color .15s; }
  .ib:hover { background:var(--hover); color:var(--fg); }
  .ib.off { opacity:.4; }
  .ib.on { background:var(--accent-soft); color:var(--accent); }

  /* ---------- left column ---------- */
  #left { position:absolute; top:14px; left:14px; z-index:1000; width:min(372px, calc(100vw - 28px)); max-height:calc(100% - 150px); display:flex; flex-direction:column; gap:10px; pointer-events:none; }
  #left > * { pointer-events:auto; }
  #shopsCard { padding:10px 8px 8px; flex:none; }
  .sh-head { display:flex; align-items:center; padding:2px 4px 6px 8px; gap:8px; }
  #collapseShops svg { transition:transform .2s; }
  #shopsCard.collapsed #collapseShops svg { transform:rotate(180deg); }
  #shopsCard.collapsed #shopList, #shopsCard.collapsed #addShop { display:none; }
  #shopsCard.collapsed .sh-head { padding-bottom:2px; }
  #miniShops { display:none; align-items:center; }
  #shopsCard.collapsed #miniShops { display:flex; }
  #miniShops .av { width:24px; height:24px; border-radius:8px; font-size:12px; box-shadow:none; border:2px solid var(--solid); margin-left:-7px; }
  #miniShops .av:first-child { margin-left:0; }
  #miniShops .av.off { opacity:.35; }
  /* blur shop names and logos, e.g. for screenshots */
  body.blurnames .shop .n, body.blurnames .shop .av, body.blurnames #miniShops .av, body.blurnames .m-shop { filter:blur(6px); user-select:none; }
  .sh-head b { font-size:15px; letter-spacing:-.01em; }
  #viewerLink { display:none; font-size:13px; font-weight:600; color:var(--accent); text-decoration:none; white-space:nowrap; }
  #shopList { max-height:236px; overflow:auto; display:flex; flex-direction:column; gap:2px; }
  .shop { display:flex; align-items:center; gap:10px; padding:7px 6px 7px 8px; border-radius:13px; cursor:pointer; border:1.5px solid transparent; }
  .shop:hover { background:var(--hover); }
  .shop.active { border-color:var(--c); background:color-mix(in srgb, var(--c) 10%, transparent); }
  .av { width:38px; height:38px; border-radius:12px; flex:none; object-fit:cover; background:var(--c); color:#fff; display:grid; place-items:center; font-weight:800; font-size:18px; box-shadow:0 3px 10px color-mix(in srgb, var(--c) 45%, transparent); }
  .shop .t { flex:1; min-width:0; }
  .shop .n { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.01em; }
  .shop .s { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .shop .dotc { width:9px; height:9px; border-radius:50%; background:var(--c); display:inline-block; margin-right:5px; }
  .shop .acts { display:flex; gap:0; flex:none; }
  /* reorder handle: drag a shop up or down (mouse and touch) */
  .shop .grip { flex:none; width:14px; margin:0 -6px 0 -4px; align-self:stretch; display:grid; place-items:center; color:var(--muted); opacity:0; cursor:grab; touch-action:none; transition:opacity .15s; }
  .shop:hover .grip, .shop.dragging .grip { opacity:.7; }
  @media (hover:none) { .shop .grip { opacity:.45; } }
  .shop.dragging { background:var(--solid); box-shadow:var(--shadow); position:relative; z-index:2; cursor:grabbing; }
  .shop.dragging .grip { cursor:grabbing; }
  body.reordering, body.reordering * { cursor:grabbing !important; user-select:none; }
  .shop .acts .ib { width:30px; height:30px; }
  .shop .acts .ib:hover { color:var(--c); }

  #kpis { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; flex:none; }
  .neg { color:var(--danger) !important; }
  .pos { color:var(--good) !important; }
  .kpi { padding:10px 6px; text-align:center; border-radius:14px; min-width:0; cursor:pointer; transition:transform .15s, border-color .15s; display:flex; flex-direction:column; justify-content:center; }
  .kpi:hover { transform:translateY(-1px); border-color:var(--accent); }
  .kpi.on { border-color:var(--accent); box-shadow:0 0 0 1.5px var(--accent), var(--shadow); }
  .kpi b { display:block; font-size:17px; letter-spacing:-.02em; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kpi span { display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kpi i { display:none; font-style:normal; font-size:11px; font-weight:700; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kpi i.show { display:block; }
  .kpi i.up { color:var(--good); } .kpi i.down { color:var(--danger); } .kpi i.flat { color:var(--muted); }

  #search { display:flex; align-items:center; gap:8px; padding:6px 6px 6px 14px; flex:none; }
  #search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--fg); font-size:15px; padding:8px 0; }
  #search input::placeholder { color:var(--muted); }
  #toggleFilters { position:relative; }
  #toggleFilters.active::after { content:""; position:absolute; top:5px; right:5px; width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--solid); }
  #filtersCard { padding:14px; overflow:auto; display:none; min-height:0; }
  #filtersCard.open { display:block; }
  #customRange input { flex:1; min-width:0; padding:7px 9px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--fg); font:inherit; font-size:13px; }
  .lbl { font-size:11px; color:var(--muted); margin:14px 0 8px; text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
  .lbl:first-child { margin-top:0; }
  .hint { font-size:12px; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:transparent; padding:5px 12px; border-radius:99px; cursor:pointer; font-size:13px; transition:all .15s; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip:hover { background:var(--hover); }
  .chip.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .chip small { opacity:.65; margin-left:5px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .link { border:0; background:none; color:var(--accent); cursor:pointer; padding:0; font-weight:600; font-size:13px; }
  .link.danger { color:var(--danger); }
  .file-row { display:flex; gap:8px; flex-wrap:nowrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  #uploadBtn { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #clear { flex:none; white-space:nowrap; }
  .btn { border:1px solid var(--line); background:transparent; padding:7px 13px; border-radius:11px; cursor:pointer; font-size:13px; font-weight:550; transition:background .15s; }
  .btn:hover { background:var(--hover); }
  .btn.primary { background:linear-gradient(135deg,var(--accent2),var(--accent)); border:0; color:#fff; }

  /* ---------- top right ---------- */
  #topright { position:absolute; top:14px; right:14px; z-index:1000; display:flex; gap:8px; align-items:flex-start; }
  #topright > .glass { display:flex; padding:4px; border-radius:14px; gap:2px; }
  #view button { border:0; background:transparent; padding:0 14px; height:34px; border-radius:10px; cursor:pointer; font-weight:600; font-size:13px; color:var(--muted); }
  #view button.on { background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff; }
  #topright .ib { width:34px; height:34px; }
  #exportWrap { position:relative; }
  #exportMenu { position:absolute; right:0; top:44px; width:260px; padding:6px; display:none; flex-direction:column; border-radius:14px; }
  #exportMenu.open { display:flex; }
  #exportMenu button { border:0; background:transparent; text-align:left; padding:9px 10px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:550; }
  #exportMenu button:hover { background:var(--hover); }
  #exportMenu small { display:block; color:var(--muted); font-weight:400; }
  #exportMenu hr { border:0; border-top:1px solid var(--line); margin:4px 6px; }

  /* ---------- bottom left: legend + display mode + base layer ---------- */
  #bl { position:absolute; left:14px; bottom:26px; z-index:1000; display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .seg { display:flex; padding:4px; gap:2px; border-radius:14px; }
  .seg button { border:0; background:transparent; padding:7px 11px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap; }
  .seg button.on { background:var(--accent-soft); color:var(--accent); }
  #legend { display:none; padding:8px 12px; border-radius:12px; font-size:12px; color:var(--muted); }
  #legend.show { display:block; }
  #legend .bar { width:180px; height:9px; border-radius:5px; background:linear-gradient(90deg,#fde7d6,#f1641e,#9c2412); margin:5px 0 3px; }

  /* ---------- right sheet (place orders / statistics) ---------- */
  #sheet { position:absolute; z-index:1100; top:66px; right:14px; width:min(430px, calc(100vw - 28px)); max-height:calc(100% - 150px); display:flex; flex-direction:column; overflow:hidden; opacity:0; transform:translateX(24px) scale(.98); pointer-events:none; transition:opacity .22s, transform .22s; border-radius:22px; }
  #sheet.open { opacity:1; transform:none; pointer-events:auto; }
  /* one soft tint across the whole top of the sheet, fading out smoothly below the header and tabs */
  #sheet::before { content:""; position:absolute; left:0; right:0; top:0; height:240px; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, color-mix(in srgb, var(--c) 20%, transparent) 0%, color-mix(in srgb, var(--c) 8%, transparent) 55%, transparent 100%); }
  #sheet > * { position:relative; z-index:1; }
  .m-head { padding:18px 18px 14px; display:flex; gap:12px; align-items:flex-start; flex:none; }
  .m-pin { width:42px; height:42px; border-radius:14px; background:var(--c); color:#fff; display:grid; place-items:center; font-size:20px; flex:none; box-shadow:0 4px 12px color-mix(in srgb, var(--c) 45%, transparent); }
  .m-title { font-size:20px; font-weight:780; letter-spacing:-.02em; line-height:1.2; }
  .m-sub { color:var(--muted); font-size:13px; }
  .m-shop { display:inline-flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; font-weight:650; padding:3px 10px 3px 4px; border-radius:99px; background:color-mix(in srgb, var(--c) 14%, transparent); }
  .m-shop .av { width:18px; height:18px; border-radius:6px; font-size:10px; box-shadow:none; }
  .m-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 18px 14px; flex:none; }
  .m-stat { background:var(--hover); border-radius:12px; padding:8px 10px; min-width:0; }
  .m-stat b { display:block; font-size:15px; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .m-stat span { display:block; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .m-list { overflow:auto; padding:4px 10px 14px; border-top:1px solid var(--line); }
  .m-h { padding:12px 8px 6px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
  .order { display:flex; gap:12px; padding:10px 8px; border-radius:12px; align-items:flex-start; }
  .order:hover { background:var(--hover); }
  .order .ic { width:34px; height:34px; border-radius:10px; background:color-mix(in srgb, var(--c) 16%, transparent); display:grid; place-items:center; flex:none; font-size:15px; }
  .order .mid { flex:1; min-width:0; }
  .order .tt { font-weight:620; overflow-wrap:anywhere; }
  .order .tt a, .rk a { color:inherit; text-decoration:none; border-bottom:1px dotted var(--muted); }
  .order .tt a:hover, .rk a:hover { color:var(--c, var(--accent)); border-bottom-color:var(--c, var(--accent)); }
  .order .mm { color:var(--muted); font-size:12.5px; overflow-wrap:anywhere; }
  .order .pr { font-weight:700; white-space:nowrap; text-align:right; }
  .order .pr small { display:block; color:var(--muted); font-weight:500; font-size:11.5px; }
  .order .pr s.old { display:block; color:var(--muted); font-weight:500; font-size:12px; }
  .order .pr .disc { display:inline-block; margin-top:3px; font-size:11px; font-weight:700; color:var(--good); background:color-mix(in srgb, var(--good) 15%, transparent); padding:1px 7px; border-radius:99px; }
  .badge.rv { background:color-mix(in srgb, #e0a800 18%, transparent); color:#b98a00; cursor:help; }
  :root[data-theme="dark"] .badge.rv { color:#f0c34a; }
  .rv-row { padding:8px 4px; border-bottom:1px solid var(--line); font-size:13px; cursor:pointer; border-radius:8px; }
  .rv-row:hover { background:var(--hover); }
  .rv-row .st { color:#e0a800; letter-spacing:1px; }
  .rv-row .mm { color:var(--muted); font-size:12px; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:99px; background:color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); color:var(--c, var(--accent)); margin-left:4px; white-space:nowrap; }
  .empty { color:var(--muted); padding:16px 8px; text-align:center; }

  /* stats */
  .st-body { overflow:auto; padding:0 16px 16px; flex:1 1 auto; min-height:0; }
  .st-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .chart { margin-top:16px; }
  .bars { display:flex; align-items:flex-end; gap:2px; height:70px; padding-top:4px; }
  .bars div { flex:1; min-width:3px; background:color-mix(in srgb, var(--muted) 35%, transparent); border-radius:3px 3px 0 0; }
  .bars div.in { background:linear-gradient(180deg,var(--accent2),var(--accent)); }
  #tlBars div { cursor:pointer; transition:background .15s; }
  #tlBars div:hover { outline:2px solid var(--accent); }
  .axis { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:4px; }
  .axis.eq span { flex:1; text-align:center; }
  .grp { display:flex; align-items:flex-end; gap:6px; height:76px; }
  .grp > div { flex:1; display:flex; align-items:flex-end; gap:1px; height:100%; }
  .grp i { flex:1; border-radius:2px 2px 0 0; min-height:1px; }
  .lgd { display:flex; gap:12px; font-size:11.5px; color:var(--muted); margin-top:6px; flex-wrap:wrap; }
  .lgd b { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .tabs { display:flex; flex-wrap:wrap; gap:3px; margin:18px 0 6px; background:var(--hover); padding:3px; border-radius:12px; }
  .tabs button { flex:1 0 auto; border:0; background:transparent; padding:6px 7px; border-radius:9px; cursor:pointer; font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap; }
  .tabs button small { font-size:10.5px; }
  .tabs button.on { background:var(--solid); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .rk { position:relative; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; cursor:pointer; overflow:hidden; margin-bottom:6px; }
  .rk:last-child { margin-bottom:0; }
  .rk:hover { background:var(--hover); }
  .rk.on { outline:2px solid var(--accent); }
  .rk .bar { position:absolute; left:0; top:0; bottom:0; background:var(--accent-soft); border-radius:10px; z-index:-1; }
  .rk .no { width:20px; color:var(--muted); font-size:12px; font-weight:700; flex:none; }
  .rk .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .rk .nm small { color:var(--muted); font-weight:400; margin-left:4px; }
  .rk .vl { font-weight:700; white-space:nowrap; font-size:13px; text-align:right; }
  .rk .vl small { color:var(--muted); font-weight:500; margin-left:6px; }
  .rk-list { position:relative; z-index:0; }
  .tab-note { font-size:12px; color:var(--muted); padding:2px 10px 8px; }

  /* ---------- shop dialog ---------- */
  #dlg { position:absolute; inset:0; z-index:1300; display:none; place-items:center; background:rgba(0,0,0,.35); backdrop-filter:blur(3px); }
  #dlg.open { display:grid; }
  #dlg .box { width:min(400px, calc(100vw - 28px)); max-height:calc(100% - 28px); overflow:auto; padding:22px; background:var(--solid); border-radius:22px; box-shadow:var(--shadow); }
  #dlg h3 { margin:0 0 16px; font-size:18px; }
  #dlg label.f { font-size:12px; color:var(--muted); display:block; margin-bottom:5px; }
  #dlg input[type=text] { width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--fg); font-size:15px; }
  #dlg .logo-row { display:flex; align-items:center; gap:12px; margin:16px 0; }
  #dlg .logo-row .av { width:52px; height:52px; border-radius:16px; font-size:24px; }
  .logo-pick { position:relative; display:block; flex:none; cursor:pointer; border-radius:16px; }
  .logo-pick .logo-edit { position:absolute; inset:0; border-radius:16px; display:grid; place-items:center; background:rgba(0,0,0,.45); color:#fff; opacity:0; transition:opacity .15s; }
  .logo-pick:hover .logo-edit, .logo-pick:focus-within .logo-edit { opacity:1; }
  #dlgRemoveLogo:hover { color:var(--danger); background:color-mix(in srgb, var(--danger) 12%, transparent); }
  #dlg .hint { margin:5px 0 16px; }
  .swatches { display:flex; gap:8px; margin:6px 0 18px; flex-wrap:wrap; }
  .sw { width:28px; height:28px; border-radius:50%; border:3px solid transparent; background:var(--c); cursor:pointer; outline:1px solid var(--line); }
  .sw.on { border-color:var(--solid); outline:2px solid var(--c); }
  .sw.custom { position:relative; background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); overflow:hidden; display:block; }
  .sw.custom.has { background:var(--c); }
  .sw.custom input { position:absolute; inset:-8px; width:48px; height:48px; opacity:0; cursor:pointer; }
  .sw.custom::after { content:"+"; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.6); pointer-events:none; }
  .sw.custom.has::after { content:"🎨"; font-size:12px; }
  .danger-row { display:flex; gap:16px; padding:12px 0; margin-bottom:12px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }

  #toast { position:absolute; left:50%; bottom:26px; transform:translateX(-50%); z-index:1200; padding:9px 18px; font-size:13px; display:none; border-radius:99px; max-width:min(560px, 90vw); text-align:center; }
  body.drop::after { content:"Відпустіть файли, щоб додати замовлення до вибраного магазину"; position:absolute; inset:0; z-index:2000; display:grid; place-items:center; text-align:center; padding:20px; font-size:22px; font-weight:700; background:rgba(241,100,30,.22); border:4px dashed var(--accent); }

  /* read-only view opened from a shared link */
  body.viewer #addShop, body.viewer .shop .acts [data-a=up], body.viewer .shop .acts [data-a=edit], body.viewer .file-row,
  body.viewer #privacyBtn, body.viewer .own-only { display:none !important; }
  body.viewer #viewerLink { display:inline; }

  /* ---------- leaflet ---------- */
  .leaflet-control-zoom { border:0 !important; box-shadow:var(--shadow) !important; border-radius:14px !important; overflow:hidden; margin:0 14px 26px 0 !important; }
  .leaflet-control-zoom a { background:var(--glass) !important; backdrop-filter:blur(18px); color:var(--fg) !important; border-color:var(--line) !important; width:36px !important; height:36px !important; line-height:36px !important; }
  .leaflet-control-attribution { background:var(--glass) !important; color:var(--muted) !important; border-radius:8px 0 0 0; }
  .leaflet-control-attribution a { color:var(--muted) !important; }
  .pinwrap, .clusterwrap, .originwrap { filter:drop-shadow(0 3px 3px rgba(0,0,0,.35)); transition:transform .15s; }
  .pinwrap { transform-origin:50% 100%; }
  .pinwrap:hover, .clusterwrap:hover { transform:scale(1.1); }
  .pinwrap.sel { transform:scale(1.25); filter:drop-shadow(0 0 8px var(--c)) drop-shadow(0 3px 3px rgba(0,0,0,.4)); z-index:9999 !important; }
  .leaflet-tooltip.origin-tip { font-weight:650; border-radius:8px; }

  /* goal bar under the revenue tile */
  .gbar { display:none; height:4px; border-radius:2px; background:var(--hover); margin:6px 6px 0; overflow:hidden; }
  .gbar.show { display:block; }
  .gbar u { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent2),var(--accent)); border-radius:2px; }
  /* money sheet */
  .goal-big b { font-size:28px; font-weight:800; letter-spacing:-.02em; }
  .goal-big span { color:var(--muted); margin-left:8px; }
  .prog { position:relative; height:12px; border-radius:99px; background:var(--hover); margin-top:8px; }
  .prog i { display:block; height:100%; max-width:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent2),var(--accent)); }
  .prog em { position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; background:var(--fg); opacity:.5; border-radius:1px; }
  .money-in { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:11px; padding:0 10px; background:var(--solid); flex:none; }
  .money-in span { color:var(--muted); font-weight:600; }
  .money-in input { border:0; outline:0; background:transparent; color:var(--fg); font:inherit; font-size:15px; width:110px; padding:8px 0; }
  .money-in.sm { padding:0 8px; border-radius:9px; }
  .money-in.sm input { width:58px; font-size:13px; padding:6px 0; }
  .money-in:focus-within { border-color:var(--accent); }
  .gform { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .mg { display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); }
  .mg:last-child { border-bottom:0; }
  .mg .mid { flex:1; min-width:0; }
  .mg .tt { font-weight:620; font-size:13px; overflow-wrap:anywhere; }
  .mg .tt a { color:inherit; text-decoration:none; border-bottom:1px dotted var(--muted); }
  .mg .mm { color:var(--muted); font-size:12px; }
  .mg-r { width:88px; text-align:right; font-size:13px; flex:none; }
  .mg-r small { display:block; color:var(--muted); font-size:11px; }
  body.blurnames .sn { filter:blur(5px); }
  .muted { color:var(--muted); }
  .cfg { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
  .cfg label { display:inline-flex; gap:6px; align-items:center; font-size:13px; cursor:pointer; }
  table.tax { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
  table.tax th { text-align:right; font-size:10.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; padding:6px 4px; }
  table.tax td { text-align:right; padding:8px 4px; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.tax th:first-child, table.tax td:first-child { text-align:left; }
  table.tax tr.tot td { font-weight:800; }
  .tax-wrap { overflow-x:auto; }
  @media (max-width:700px) { table.tax { font-size:12px; } table.tax td, table.tax th { padding:7px 2px; } table.tax td small { display:none; } }
  /* sales calendar */
  .cal { display:grid; grid-template-rows:repeat(7,1fr); grid-auto-flow:column; grid-auto-columns:1fr; gap:2px; }
  .cal i { aspect-ratio:1; border-radius:2px; background:var(--hover); cursor:pointer; }
  .cal i:hover { outline:1.5px solid var(--accent); }
  .cal i.out { background:transparent; cursor:default; }
  .cal i.out:hover { outline:0; }
  .cal i.l1 { background:color-mix(in srgb, var(--accent) 28%, transparent); }
  .cal i.l2 { background:color-mix(in srgb, var(--accent) 50%, transparent); }
  .cal i.l3 { background:color-mix(in srgb, var(--accent) 75%, transparent); }
  .cal i.l4 { background:var(--accent); }
  /* instant tooltip for small chart cells (the native title shows only after ~1 s) */
  #tip { position:fixed; z-index:3000; pointer-events:none; background:var(--fg); color:var(--solid); font-size:12px; font-weight:600; padding:4px 9px; border-radius:8px; white-space:nowrap; box-shadow:var(--shadow); opacity:0; transition:opacity .08s; }
  #tip.show { opacity:1; }
  /* timelapse badge */
  #tlBox { position:absolute; z-index:1050; bottom:26px; left:50%; transform:translateX(-50%); width:min(500px, calc(100vw - 28px)); display:none; flex-direction:column; gap:2px; padding:6px 8px 8px; border-radius:18px; user-select:none; }
  #tlBox.show { display:flex; }
  #tlBox .tl-row { display:flex; align-items:center; gap:2px; }
  #tlBox .tl-mid { flex:1; min-width:0; display:flex; align-items:baseline; gap:8px; padding:0 6px; white-space:nowrap; overflow:hidden; }
  #tlBox b { font-size:16px; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  #tlBox span { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  #tlBox .ib { font-size:18px; font-weight:700; }
  #tlPlay { background:var(--accent-soft); color:var(--accent) !important; }
  /* speed: a pill; hovering (or tapping) it smoothly opens a small menu of speeds above it */
  .tl-sp { position:relative; flex:none; }
  .tl-menu { position:absolute; right:0; bottom:calc(100% + 10px); min-width:136px; padding:5px; display:flex; flex-direction:column; gap:1px; border-radius:14px; background:var(--solid); border:1px solid var(--line); box-shadow:var(--shadow);
    opacity:0; transform:translateY(8px) scale(.95); transform-origin:bottom right; pointer-events:none; transition:opacity .18s ease, transform .18s cubic-bezier(.2,.9,.3,1.2); }
  .tl-menu::after { content:""; position:absolute; left:0; right:0; top:100%; height:12px; } /* hover bridge to the pill */
  .tl-sp:hover .tl-menu, .tl-sp.open .tl-menu { opacity:1; transform:none; pointer-events:auto; }
  .tl-sp.hold .tl-menu { opacity:0; transform:translateY(8px) scale(.95); pointer-events:none; }
  .tl-menu button { display:flex; align-items:center; gap:8px; border:0; background:transparent; padding:7px 10px; border-radius:9px; cursor:pointer; font-size:13px; color:var(--fg); text-align:left; white-space:nowrap; }
  .tl-menu button:hover { background:var(--hover); }
  .tl-menu button b { min-width:22px; font-variant-numeric:tabular-nums; }
  .tl-menu button.on { background:var(--accent-soft); color:var(--accent); font-weight:700; }
  .tl-menu button.on::after { content:"✓"; margin-left:auto; }
  #tlSpeed { display:inline-flex; align-items:center; gap:5px; flex:none; border:0; border-radius:99px; padding:5px 11px 5px 8px; cursor:pointer; background:var(--hover); color:var(--muted); font-size:12px; font-weight:600; transition:background .15s, color .15s; }
  #tlSpeed:hover { background:var(--accent-soft); color:var(--accent); }
  #tlSpeed b { color:var(--fg); font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; }
  #tlSpeed:hover b { color:var(--accent); }
  #tlSpeed svg { opacity:.8; }
  #tlSpeed.bump b { animation:tlBump .25s; }
  @keyframes tlBump { 50% { transform:scale(1.25); } }
  /* slider: thin light track, accent fill up to the current day, white knob */
  #tlRange { -webkit-appearance:none; appearance:none; width:100%; height:6px; margin:6px 0 2px; border-radius:99px; cursor:pointer; outline:none;
    background:linear-gradient(90deg, var(--accent2), var(--accent) var(--p, 0%), color-mix(in srgb, var(--muted) 22%, transparent) var(--p, 0%)); }
  #tlRange::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; border:3px solid var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.25); }
  #tlRange::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:#fff; border:3px solid var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.25); }
  #tlRange:focus-visible::-webkit-slider-thumb { box-shadow:0 0 0 4px var(--accent-soft); }
  @media (min-width:701px) and (max-width:1180px) { #tlBox { bottom:176px; } }

  @media (max-width:700px) {
    #tlBox { top:auto; bottom:46%; }
    #left { top:10px; left:10px; width:calc(100vw - 20px); max-height:calc(100% - 170px); gap:8px; }
    #shopList { max-height:108px; }
    #sheet { top:auto; bottom:0; right:0; left:0; width:100%; max-height:66%; border-radius:22px 22px 0 0; transform:translateY(40px); }
    #topright { top:auto; bottom:16px; right:10px; flex-direction:column-reverse; align-items:flex-end; }
    #topright > .glass { flex-direction:column; }
    #view button { padding:0 8px; font-size:12px; }
    #exportMenu { top:auto; bottom:0; right:48px; }
    #bl { left:10px; bottom:16px; }
    .seg button { padding:7px 9px; font-size:12px; }
    #modes .tx { display:none; }
    #modes button { font-size:16px; padding:5px 11px; }
    #legend .bar { width:140px; }
    .leaflet-control-zoom { display:none; }
    #toast { bottom:auto; top:12px; border-radius:14px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="left">
  <div id="shopsCard" class="glass">
    <div class="sh-head"><b id="shopsTitle">Мої магазини</b><span id="miniShops"></span><span style="flex:1"></span><button class="btn primary" id="addShop" style="padding:5px 12px">＋ Додати</button><a id="viewerLink" href="./">Створити свою мапу →</a><button class="ib" id="blurShops"></button><button class="ib" id="collapseShops"></button></div>
    <div id="shopList"></div>
  </div>

  <div id="kpis">
    <div class="glass kpi"><b id="kOrders">0</b><span>Замовлень</span><i id="dOrders"></i></div>
    <div class="glass kpi"><b id="kCities">0</b><span>Міст</span><i id="dCities"></i></div>
    <div class="glass kpi"><b id="kCountries">0</b><span>Країн</span><i id="dCountries"></i></div>
    <div class="glass kpi"><b id="kRev">—</b><span>Дохід</span><i id="dRev"></i><em id="gRev" class="gbar"><u></u></em></div>
    <div class="glass kpi own-only"><b id="kCosts">—</b><span>Витрати</span><i id="dCosts"></i></div>
    <div class="glass kpi own-only"><b id="kProfit">—</b><span>Чистий прибуток</span><i id="dProfit"></i></div>
  </div>

  <div id="search" class="glass">
    <span aria-hidden="true">🔍</span>
    <input id="q" type="search" placeholder="Пошук міста, країни чи покупця" autocomplete="off">
    <button class="ib" id="toggleFilters" title="Фільтри"></button>
  </div>

  <div id="filtersCard" class="glass">
    <div class="lbl">Період</div>
    <div class="chips" id="rangeChips"></div>
    <div id="customRange" style="display:none;gap:8px;align-items:center;margin-top:10px"><input type="date" id="dFrom" aria-label="Початок"><span style="color:var(--muted)">—</span><input type="date" id="dTo" aria-label="Кінець"></div>
    <div id="rangeNote" class="hint" style="margin-top:6px"></div>
    <div class="lbl">Порівнювати з</div>
    <div class="chips" id="cmpChips"></div>
    <div class="lbl">Товар</div>
    <div id="itemFilter"></div>
    <div class="lbl">Покупці</div>
    <div class="chips"><button class="chip" id="repeatChip">🔁 Лише повторні покупці</button></div>
    <div class="lbl">Валюта сум</div>
    <div class="chips" id="curChips"></div>
    <div id="curNote" class="hint" style="margin-top:6px"></div>
    <div class="lbl">Країни</div>
    <div class="chips" id="countryChips"></div>
    <div class="row" style="margin-top:12px"><button class="link" id="reset">Скинути фільтри</button><button class="link" id="fit">Показати всі піни</button></div>
    <div class="file-row">
      <button class="btn primary" id="uploadBtn">📂 Завантажити CSV / JSON</button>
      <button class="btn" id="clear" title="Очистити кеш геокодингу">Скинути кеш</button>
    </div>
    <input id="file" type="file" accept=".csv,.json" multiple hidden>
    <input id="restoreFile" type="file" accept=".json" hidden>
  </div>
</div>

<div id="topright">
  <div class="glass" id="view"><button data-v="world" class="on">Світ</button><button data-v="usa">США</button></div>
  <div class="glass">
    <button class="ib" id="routesBtn" title="Маршрути від вашого міста до покупців"></button>
    <button class="ib" id="statsBtn" title="Статистика"></button>
    <button class="ib own-only" id="moneyBtn" title="Гроші: ціль, собівартість, знижки, податок"></button>
    <button class="ib" id="playTop" title="Таймлапс: як з'являлися замовлення"></button>
    <button class="ib" id="privacyBtn" title="Приватний режим"></button>
    <button class="ib" id="themeBtn" title="Тема"></button>
    <div id="exportWrap">
      <button class="ib" id="exportBtn" title="Експорт і дані"></button>
      <div id="exportMenu" class="glass">
        <button id="expPng">🖼 Зображення мапи (PNG)<small>Для поста чи звіту, з назвою магазину</small></button>
        <button id="expReport">📊 Звіт за період (PNG)<small>Цифри, мапа, топ товарів і регіонів — для себе чи бухгалтера</small></button>
        <button id="expCsv">📄 Замовлення (CSV)<small>Лише ті, що зараз видно на мапі</small></button>
        <button id="expShare" class="own-only">🔗 Посилання для перегляду<small>Мапа без імен покупців — для друзів</small></button>
        <button id="expInstall">📲 Встановити як застосунок<small>Іконка на телефоні чи в Dock, відкривається без інтернету</small></button>
        <hr class="own-only">
        <button id="expBackup" class="own-only">💾 Резервна копія (JSON)<small>Усі магазини й замовлення в одному файлі</small></button>
        <button id="expRestore" class="own-only">📥 Відновити з копії<small>Замінить поточні дані</small></button>
      </div>
    </div>
  </div>
</div>

<div id="bl">
  <div class="glass" id="legend"><div class="row"><b style="color:var(--fg)" id="legendTitle">Замовлень у регіоні</b><button class="link" id="perCapBtn" style="font-size:12px"></button></div><div class="bar"></div><div class="row"><span id="legendMin">1</span><span id="legendMax"></span></div></div>
  <div class="glass seg" id="modes"><button data-d="pins" title="Піни">📍<span class="tx"> Піни</span></button><button data-d="groups" title="Групи">⭕<span class="tx"> Групи</span></button><button data-d="heat" title="Теплова мапа">🔥<span class="tx"> Теплова</span></button><button data-d="regions" title="Регіони: країни й штати">🗺<span class="tx"> Регіони</span></button></div>
  <div class="glass seg" id="layers"><button data-m="map" class="on">Мапа</button><button data-m="sat">Супутник</button><button data-m="terrain">Рельєф</button></div>
</div>

<div id="sheet" class="glass" aria-live="polite"></div>
<div id="tlBox" class="glass" title="Прокручуйте тут, щоб гортати дні · ← → · пробіл — пауза">

    <button class="ib" id="tlPrev" title="Попередній день (←)">‹</button>
    <button class="ib" id="tlPlay"></button>
    <button class="ib" id="tlNext" title="Наступний день (→)">›</button>
    <div class="tl-mid"><b id="tlDate"></b><span id="tlCount"></span></div>
    <div class="tl-sp" id="tlSp"><button id="tlSpeed" aria-haspopup="true" aria-label="Швидкість"></button><div class="tl-menu" id="tlMenu" role="menu"></div></div>
    <button class="ib" id="tlStop" title="Закрити таймлапс">✕</button>
  </div>
  <input type="range" id="tlRange" min="0" max="0" value="0" aria-label="День таймлапсу">
</div>

<div id="dlg">
  <div class="box">
    <div class="row" style="margin:-4px -6px 12px 0"><h3 id="dlgTitle" style="margin:0">Новий магазин</h3><button class="ib" id="dlgClose" title="Закрити (Esc)">✕</button></div>
    <label class="f">Назва магазину</label>
    <input type="text" id="dlgName" maxlength="40" placeholder="Наприклад, My Handmade Shop">
    <div class="logo-row">
      <label class="logo-pick" title="Змінити логотип"><div class="av" id="dlgAv"></div><span class="logo-edit"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span><input id="dlgFile" type="file" accept="image/*" hidden></label>
      <div class="hint" id="dlgLogoHint" style="flex:1;margin:0"></div>
      <button class="ib" id="dlgRemoveLogo" title="Прибрати логотип"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
    </div>
    <div class="row"><label class="f" style="margin:0">Колір пінів</label><button class="link" id="dlgFromLogo" style="display:none">🎨 Взяти з логотипа</button></div>

    <div class="hint" id="dlgOriginHint">Необов'язково.</div>

      <button class="link danger" id="dlgClear">Очистити дані</button>
      <button class="link danger" id="dlgDelete">Видалити магазин</button>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="dlgCancel">Скасувати</button><button class="btn primary" id="dlgSave">Зберегти</button></div>
  </div>
</div>
<div id="toast" class="glass"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script>
const $ = id => document.getElementById(id);
const ls = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); return true; } catch { return false; } }, del(k){ try { localStorage.removeItem(k); } catch {} } };
let toastTimer; const toast = (t, ms) => { const el=$('toast'); clearTimeout(toastTimer); if(!t){ el.style.display='none'; return; } el.textContent=t; el.style.display='block'; if(ms) toastTimer=setTimeout(()=>el.style.display='none', ms); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS = ['#f1641e','#2f80ed','#1fa971','#9b51e0','#e5484d','#e0a800','#0fa3b1','#e255a1'];

// ================= storage: IndexedDB (falls back to localStorage) =================
const kv = (() => {
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no indexedDB'));
    const r = indexedDB.open('etsy-orders-map', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('kv', mode), q = fn(t.objectStore('kv')); t.oncomplete = () => res(q.result); t.onerror = t.onabort = () => rej(t.error); }); };
  return {
    async get(k) { try { return await tx('readonly', s => s.get(k)); } catch { try { return JSON.parse(ls.get('kv:'+k)) ?? undefined; } catch { return undefined; } } },
    async set(k, v) { if (viewOnly) return true; try { await tx('readwrite', s => s.put(v, k)); return true; } catch { return ls.set('kv:'+k, JSON.stringify(v)); } },
    async del(k) { if (viewOnly) return; try { await tx('readwrite', s => s.delete(k)); } catch {} ls.del('kv:'+k); },
  };
})();

// repeat buyers: every order gets nth (1-based) and of (total orders by that buyer in this shop)
const buyerKey = o => (o.buyer||'').trim().toLowerCase().replace(/\s+/g,' ');
function computeRepeat(shop) {
  const by = new Map();
  shop.places.forEach(p => p.orders.forEach(o => { const k = buyerKey(o); o.nth = 0; o.of = 0; if (k) { if (!by.has(k)) by.set(k, []); by.get(k).push(o); } }));
  by.forEach(list => { list.sort((a,b) => (Date.parse(a.date)||0) - (Date.parse(b.date)||0)); list.forEach((o,i) => { o.nth = i+1; o.of = list.length; }); });
}

// drag the ⋮⋮ handle to reorder shops: rows swap live under the pointer, the order is saved on release
$('shopList').addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (!g || e.button > 0) return;
  e.preventDefault();
  const box = $('shopList'), el = g.closest('.shop'), y0 = e.clientY; let moved = false;
  el.classList.add('dragging'); document.body.classList.add('reordering'); g.setPointerCapture(e.pointerId);
  const move = ev => {
    if (Math.abs(ev.clientY - y0) > 3) moved = true;
    const sib = [...box.children].filter(x => x !== el);
    const after = sib.find(x => { const r = x.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
    if (after ? el.nextElementSibling !== after : box.lastElementChild !== el) box.insertBefore(el, after || null);
    // keep the list scrolling when dragging near its edges
    const r = box.getBoundingClientRect(); if (ev.clientY < r.top + 20) box.scrollTop -= 8; else if (ev.clientY > r.bottom - 20) box.scrollTop += 8;
  };
  const up = () => {
    g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up);
    el.classList.remove('dragging'); document.body.classList.remove('reordering');
    const order = [...box.children].map(x => x.dataset.id);
    if (moved && order.join() !== shops.map(s => s.id).join()) {
      shops.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
      saveShops(); renderShops(); refresh(false);
    }
  };
  g.addEventListener('pointermove', move); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
});

// dominant saturated colour of an image — ignores transparent, near-white/black and grey pixels
function dominantColor(src) {
  const s = 40, c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d', { willReadFrequently:true }); x.drawImage(src, 0, 0, s, s);
  const d = x.getImageData(0, 0, s, s).data, B = Array.from({length:12}, () => ({w:0,r:0,g:0,b:0}));
  for (let i = 0; i < d.length; i += 4) {
    if (d[i+3] < 128) continue;
    const r=d[i]/255, g=d[i+1]/255, b=d[i+2]/255, mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, dd=mx-mn;
    if (dd < .08 || l > .93 || l < .07) continue;
    const sat = dd / (1 - Math.abs(2*l - 1));
    if (sat < .3) continue;
    let h = mx===r ? ((g-b)/dd)%6 : mx===g ? (b-r)/dd+2 : (r-g)/dd+4; h = (h*60+360)%360;
    const w = sat * (1 - Math.abs(l - .5)), k = B[Math.floor(h/30)%12];
    k.w += w; k.r += d[i]*w; k.g += d[i+1]*w; k.b += d[i+2]*w;
  }
  const top = B.reduce((a,b) => b.w > a.w ? b : a);
  if (top.w <= 0) return null;
  let r=top.r/top.w/255, g=top.g/top.w/255, b=top.b/top.w/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, t=Math.min(.55, Math.max(.38, l));
  if (t !== l) { const f = t > l ? (t - l) / (1 - l) : (t - l) / l; const mix = v => f > 0 ? v + (1 - v) * f : v * (1 + f); r=mix(r); g=mix(g); b=mix(b); }
  return '#' + [r,g,b].map(v => Math.round(Math.min(1,Math.max(0,v))*255).toString(16).padStart(2,'0')).join('');
}

// ================= parsing =================
// Etsy writes some characters as HTML codes in its CSVs (&quot; &#39; &amp; …) — turn them back into text
const ENT = { quot:'"', amp:'&', apos:"'", lt:'<', gt:'>', nbsp:' ' };
function unent(v) {
  if (typeof v !== 'string' || !v.includes('&')) return v;
  for (let i = 0; i < 2 && /&(#x[0-9a-f]+|#\d+|quot|amp|apos|lt|gt|nbsp);/i.test(v); i++) // twice: "&amp;quot;" → "&quot;" → '"'
    v = v.replace(/&(#x[0-9a-f]+|#\d+|quot|amp|apos|lt|gt|nbsp);/gi, (m, e) => e[0] === '#' ? String.fromCodePoint(e[1].toLowerCase() === 'x' ? parseInt(e.slice(2), 16) : +e.slice(1)) : ENT[e.toLowerCase()]);
  return v;
}
function parseCSV(text) {
  const rows=[]; let row=[], cur='', q=false;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch=='"') q=true;
    else if(ch==','){ row.push(cur); cur=''; }
    else if(ch=='\n'||ch=='\r'){ if(ch=='\r'&&text[i+1]=='\n') i++; row.push(cur); cur=''; if(row.some(x=>x!=='')) rows.push(row); row=[]; }
    else cur+=ch;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  const head = (rows.shift()||[]).map(h=>h.trim().toLowerCase().replace(/^﻿/,''));

  else if (filt.range === 'quarter') ps = new Date(s.getFullYear(), s.getMonth()-3, 1);
  else if (filt.range === 'year') ps = new Date(s.getFullYear()-1, 0, 1);

  const gid = 'g'+color.slice(1);

    html:`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 24 36" style="--c:${color}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".78"/><stop offset="1" stop-color="${color}"/></linearGradient></defs><path d="M12 .8C5.8.8.8 5.8.8 12c0 8.6 11.2 23 11.2 23S23.2 20.6 23.2 12C23.2 5.8 18.2.8 12 .8z" fill="url(#${gid})" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="7.6" fill="#fff"/>${label}</svg>` });

  let off = 0;
  const segs = [...by].map(([c,n]) => { const len = n/total*100; const s = `<circle cx="20" cy="20" r="${r}" fill="none" stroke="${c}" stroke-width="5.5" stroke-dasharray="${len} ${100-len}" stroke-dashoffset="${-off}" transform="rotate(-90 20 20)"/>`; off += len; return s; }).join('');

    html:`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="${theme === 'dark' ? '#2b2927' : '#fff'}"/>${segs}<text x="20" y="24.2" text-anchor="middle" font-size="${total>999?9:total>99?10.5:12.5}" font-weight="800" font-family="system-ui,-apple-system,sans-serif" fill="${theme === 'dark' ? '#f4efe9' : '#1c1b1a'}">${total}</text></svg>` });

    html:`<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15.5" fill="${color}" stroke="#fff" stroke-width="2.5"/><path d="M10 17.5 17 11l7 6.5M12 16v7h4v-4h2v4h4v-7" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>` });

function arc(a, b) { // gently curved line between two [lat,lng] points, taking the short way around the globe
  let [la1, lo1] = a, [la2, lo2] = b;

  const c = [(la1+la2)/2 - (lo2-lo1)*.16, (lo1+lo2)/2 + (la2-la1)*.16], pts = [];

function drawRegions(vis) {

  vis.forEach(e => { const n = e.orders.length; byCountry.set(e.place.country, (byCountry.get(e.place.country)||0) + n); if (isUS(e.place.country)) { const sc = stateCode(e.place.state); if (sc) byState.set(sc, (byState.get(sc)||0) + n); } });

function pctDelta(cur, prev) {
  if (!prev && !cur) return { t:'', c:'flat' };
  if (!prev) return { t:'нове', c:'up' };
  const p = Math.round((cur - prev) / Math.abs(prev) * 100);
  return { t: (p > 0 ? '▲ ' : p < 0 ? '▼ ' : '') + Math.abs(p) + '%', c: p > 0 ? 'up' : p < 0 ? 'down' : 'flat' };
}
function absDelta(cur, prev) { const d = cur - prev; return { t: d > 0 ? '▲ ' + d : d < 0 ? '▼ ' + (-d) : '±0', c: d > 0 ? 'up' : d < 0 ? 'down' : 'flat' }; }

function redraw(fit=false) {

  if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
  $('legend').classList.remove('show');
  const vis = visibleEntries(), all = [];
  $('toggleFilters').classList.toggle('active', !!(filt.q || filt.countries.size || filt.range!=='all' || filt.repeat || filt.item || filt.vari));
  vis.forEach(e => all.push(...e.orders));
  if (display === 'regions') {
    if (regionsGeo) drawRegions(vis);
    else { toast('Завантажую кордони країн і штатів…'); loadRegions().then(() => { toast(''); if (display === 'regions') redraw(false); }).catch(() => toast('Не вдалося завантажити кордони. Перевірте інтернет.', 4000)); }

    for (const e of vis) {
      const n = e.orders.length, isSel = selected?.place === e.place;
      if (display === 'heat') {
        markers.push(L.circleMarker([e.place.lat, e.place.lng], { radius:isSel?7:4.5, color:'#fff', weight:1.5, fillColor:e.shop.color, fillOpacity:1, orders:n, bubblingMouseEvents:false })
          .bindTooltip(`${esc(e.place.city||'—')}: ${n}`, { direction:'top' }).on('click', () => openPlace(e)));
      } else {
        const grp = slots.get(e.place.lat.toFixed(2)+','+e.place.lng.toFixed(2));
        const shift = grp.length>1 ? (grp.indexOf(e) - (grp.length-1)/2) * 16 : 0;
        markers.push(L.marker([e.place.lat, e.place.lng], { icon:pinIcon(n, isSel, e.shop.color, shift), title:`${e.shop.name}: ${e.place.city||''} — ${n}`, riseOnHover:true, orders:n, color:e.shop.color }).on('click', () => openPlace(e)));
      }
    }
    if (display === 'groups') { clusterLayer.addLayers(markers); if (!map.hasLayer(clusterLayer)) map.addLayer(clusterLayer); }

      pinLayer.eachLayer(l => l.bringToFront());

    for (const s of shops) {

      mine.forEach(e => L.polyline(arc(o, [e.place.lat, e.place.lng]), { color:s.color, weight: Math.min(4, 1.2 + Math.log2(e.orders.length)*.7), opacity:.55, interactive:false }).addTo(routeLayer));

// ================= right sheet: money (goal, product costs, discounts, income tax) =================
const jget = (k, d) => { try { return { ...d, ...JSON.parse(ls.get(k) || '{}') }; } catch { return { ...d }; } };
let moneyTab = ['goal','margin','coupons','tax'].includes(ls.get('etsyMoneyTab')) ? ls.get('etsyMoneyTab') : 'goal';
let goal = jget('etsyGoal', { period:'month', amount:0, cur:'' });
let taxCfg = jget('etsyTax', { rate:5, base:'', year:new Date().getFullYear() });
if (taxCfg.extra == null) taxCfg.extra = taxCfg.vz === false ? 0 : 1; // older setting: Ukrainian military levy on/off
if (taxCfg.cur == null) taxCfg.cur = 'UAH';
const PERIODS = [['month','Місяць'],['quarter','Квартал'],['year','Рік']], PER_LBL = { month:'місяць', quarter:'квартал', year:'рік' };
function periodBounds(k, n = new Date()) {
  const y = n.getFullYear(), m = n.getMonth();
  if (k === 'year') return [+new Date(y, 0, 1), +new Date(y+1, 0, 1)];
  if (k === 'quarter') { const q = Math.floor(m/3)*3; return [+new Date(y, q, 1), +new Date(y, q+3, 1)]; }
  return [+new Date(y, m, 1), +new Date(y, m+1, 1)];
}
const periodName = (k, b) => { const d = new Date(b[0]); return k === 'year' ? String(d.getFullYear()) : k === 'quarter' ? `${Math.floor(d.getMonth()/3)+1} кв. ${d.getFullYear()}` : `${MONTHS_FULL[d.getMonth()]} ${d.getFullYear()}`; };
const MONTHS_FULL = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const curSymbol = c => fmtMoney(0, c).replace(/[\d.,\s]/g, '') || c;
const convTo = (v, from, to) => from === to ? v : rates?.[from] && rates?.[to] ? v / rates[from] * rates[to] : null;
let ratesTry = null;
const needRates = () => { if (!rates && !ratesTry) ratesTry = loadRates().then(ok => { if (ok) refresh(false); }); };
const allOrders = () => shops.filter(s => s.visible).flatMap(s => s.places.flatMap(p => p.orders));
const ordersIn = b => allOrders().filter(o => { const t = Date.parse(o.date); return !isNaN(t) && t >= b[0] && t < b[1]; });
function sumIn(orders, cur) {
  let v = 0, miss = 0;
  orders.forEach(o => { if (o.total == null) return; const c = convTo(o.total, o.currency || 'USD', cur); if (c == null) { miss++; needRates(); } else v += c; });
  return { v, miss };
}
const goalCur = () => goal.cur || dispCur || moneyAgg(allOrders()).cur || 'USD';
// the goal ignores filters: all orders of visible shops in the current month / quarter / year
function goalStatus() {
  if (!(goal.amount > 0)) return null;
  const b = periodBounds(goal.period), cur = goalCur(), s = sumIn(ordersIn(b), cur);
  const f = Math.min(1, Math.max(0, (Date.now() - b[0]) / (b[1] - b[0])));
  return { b, cur, ...s, pct: s.v / goal.amount, f, forecast: f > .04 ? s.v / f : null, left: Math.max(0, goal.amount - s.v), daysLeft: Math.max(1, Math.ceil((b[1] - Date.now()) / 864e5)) };
}
function updateGoalBar() {
  const g = viewOnly ? null : goalStatus(), el = $('gRev');
  el.classList.toggle('show', !!g);
  if (!g) return el.removeAttribute('title');
  el.firstChild.style.width = Math.min(100, g.pct * 100) + '%';
  el.title = `Натисніть, щоб відкрити ціль. Ціль на ${PER_LBL[goal.period]}: ${fmtMoney(g.v, g.cur)} з ${fmtMoney(goal.amount, g.cur)} (${Math.round(g.pct * 100)}%)`;
}

function goalHTML() {
  const cur = goalCur(), g = goalStatus();
  let html = `<div class="lbl">Ціль доходу</div>
    <div class="gform"><div class="chips">${PERIODS.map(([k,l]) => `<button class="chip${goal.period===k?' on':''}" data-p="${k}">${l}</button>`).join('')}</div>

  if (!g) html += '<div class="empty">Вкажіть суму — і тут з\'явиться прогрес, прогноз до кінця періоду та скільки треба продавати щодня. Під плиткою «Дохід» теж буде смужка прогресу.</div>';
  else {
    const ahead = g.v >= goal.amount * g.f;
    html += `<div class="goal-big"><b>${esc(fmtMoney(g.v, cur))}</b><span>з ${esc(fmtMoney(goal.amount, cur))} · ${Math.round(g.pct * 100)}%</span></div>
      <div class="prog"><i style="width:${Math.min(100, g.pct * 100)}%"></i><em style="left:${g.f * 100}%" title="Сьогодні: минуло ${Math.round(g.f * 100)}% періоду"></em></div>
      <div class="hint" style="margin:7px 0 12px">${esc(periodName(goal.period, g.b))} · минуло ${Math.round(g.f * 100)}% періоду (риска на смужці)${g.miss ? ` · ${g.miss} зам. в іншій валюті без курсу` : ''}</div>
      <div class="st-grid">
        <div class="m-stat"><b class="${g.forecast == null ? '' : g.forecast >= goal.amount ? 'pos' : 'neg'}">${g.forecast == null ? '—' : esc(fmtMoney(g.forecast, cur))}</b><span>Прогноз на кінець</span></div>
        <div class="m-stat"><b>${g.left ? esc(fmtMoney(g.left / g.daysLeft, cur)) : '✓'}</b><span>${g.left ? `Треба на день · ще ${g.daysLeft} дн.` : 'Ціль досягнута'}</span></div>
      </div>
      <div class="tab-note" style="padding:10px 2px 0">${g.pct >= 1 ? '🎉 Ціль уже виконана!' : ahead ? '✅ Йдете з випередженням графіка.' : '⚠️ Поки що відстаєте від графіка.'} Прогноз рахується так, ніби продажі й далі йтимуть тим самим темпом. Фільтри не враховуються — лише видимі магазини.</div>`;
    const hist = [];

      const b = periodBounds(goal.period, d), x = sumIn(ordersIn(b), cur); if (x.v > 0) hist.push({ b, v:x.v });

// ---- cost of goods & margin per listing ----
function itemStats(entries) {
  const m = new Map();
  entries.forEach(e => e.orders.forEach(o => itemsOf(o).forEach(it => {
    const k = itemKey(it); if (!k) return;
    const key = e.shop.id + '|' + k, lp = linePaid(it, o), oc = o.currency || 'USD';
    if (!m.has(key)) m.set(key, { shop:e.shop, it, k, units:0, rev:0, cur:oc, miss:0 });
    const x = m.get(key); x.units += it.q || 1;
    const v = lp.paid == null ? null : convTo(lp.paid, oc, x.cur);
    if (v == null) x.miss++; else x.rev += v;
  })));
  return [...m.values()].sort((a,b) => b.rev - a.rev || b.units - a.units);
}
function marginHTML() {
  const list = itemStats(visibleEntries()).slice(0, 150);
  if (!list.length) return ['<div class="empty">Тут з\'являться товари з файлу «Sold Order Items». Для кожного вкажете собівартість однієї штуки — і побачите реальний прибуток і маржу.</div>'];
  const many = shops.filter(s => s.visible).length > 1;
  const res = x => { const c = unitCost(x.shop, x.it); if (c == null) return '<span class="muted">—</span>'; const pr = x.rev - c * x.units, mg = x.rev ? pr / x.rev : 0; return `<b class="${pr >= 0 ? 'pos' : 'neg'}">${pr >= 0 ? '+' : ''}${esc(fmtMoney(pr, x.cur))}</b><small>маржа ${Math.round(mg * 100)}%</small>`; };
  const sum = () => {
    const w = list.filter(x => unitCost(x.shop, x.it) != null);
    const rev = moneyAgg(w.map(x => ({ currency:x.cur, v:x.rev })), 'v'), cg = moneyAgg(w.map(x => ({ currency:x.cur, v:unitCost(x.shop, x.it) * x.units })), 'v'), pr = moneyAgg(w.map(x => ({ currency:x.cur, v:x.rev - unitCost(x.shop, x.it) * x.units })), 'v');
    return `<div class="st-grid">
      <div class="m-stat"><b>${esc(fmtAgg(rev))}</b><span>Дохід з цих товарів</span></div>
      <div class="m-stat"><b class="${cg.n ? 'neg' : ''}">${cg.n ? '-' : ''}${esc(fmtAgg(cg))}</b><span>Собівартість</span></div>
      <div class="m-stat"><b class="${pr.n ? (pr.v >= 0 ? 'pos' : 'neg') : ''}">${pr.n && pr.v > 0 ? '+' : ''}${esc(fmtAgg(pr))}</b><span>Валовий прибуток</span></div>
      <div class="m-stat"><b>${rev.n && rev.v ? Math.round(pr.v / rev.v * 100) + '%' : '—'}</b><span>Маржа · ${w.length} з ${list.length} тов.</span></div></div>`;
  };
  const rows = list.map((x, i) => `<div class="mg"><div class="mid"><div class="tt">${listingLink(x.it)}</div>
      <div class="mm">${many ? `<span class="sn">${esc(x.shop.name)}</span> · ` : ''}${x.units} шт. · ${esc(fmtMoney(x.rev, x.cur))}${x.miss ? ` · ${x.miss} без ціни` : ''}</div></div>
      <label class="money-in sm" title="Собівартість 1 шт."><span>${esc(curSymbol(x.cur))}</span><input type="number" min="0" step="0.01" inputmode="decimal" data-i="${i}" placeholder="за 1 шт." value="${unitCost(x.shop, x.it) ?? ''}"></label>
      <div class="mg-r" id="mgR${i}">${res(x)}</div></div>`).join('');
  return [`<div class="tab-note" style="padding:0 2px 10px">Вкажіть, скільки вам коштує <b>1 штука</b> товару: матеріали, друк, пакування. Дохід — це ціна, яку заплатив покупець, уже зі знижкою. Собівартість також додається до плиток «Витрати» й «Чистий прибуток».</div>
    <div id="mgSum">${sum()}</div><div class="lbl">Товари · ${esc(rangeLabel())}</div>${rows}`, () => {
    $('sheet').querySelectorAll('.mg input').forEach(inp => inp.onchange = () => {
      const x = list[+inp.dataset.i], raw = inp.value.trim(), v = raw === '' ? null : parseFloat(raw);
      x.shop.costs ||= {};
      if (v == null || isNaN(v) || v < 0) delete x.shop.costs[x.k]; else x.shop.costs[x.k] = Math.round(v * 100) / 100;
      // the same listing may appear in several rows only across shops; refresh every row of this shop+listing
      list.forEach((y, j) => { if (y.shop === x.shop && y.k === x.k) $('mgR' + j).innerHTML = res(y); });
      saveShops(); $('mgSum').innerHTML = sum(); if (!viewOnly) updateFinanceKPIs(compareBounds());

// ---- discounts & coupons ----
function couponsHTML() {
  const orders = visibleEntries().flatMap(e => e.orders);
  if (!orders.length) return ['<div class="empty">Немає замовлень для цих фільтрів</div>'];
  const known = orders.some(o => o.discount != null || o.coupon || itemsOf(o).some(it => it.d != null));
  const withD = orders.filter(o => orderDiscount(o) > 0 || o.coupon), noD = orders.filter(o => !(orderDiscount(o) > 0 || o.coupon));
  const dAgg = moneyAgg(withD.map(o => ({ currency:o.currency || 'USD', v:orderDiscount(o) })), 'v');
  const gross = moneyAgg(withD.map(o => ({ currency:o.currency || 'USD', v:(o.total || 0) + orderDiscount(o) })), 'v');
  const avg = list => { const a = moneyAgg(list); return a.n ? fmtMoney(a.v / a.n, a.cur) : '—'; };
  let html = `<div class="st-grid">
    <div class="m-stat"><b>${withD.length} · ${Math.round(withD.length / orders.length * 100)}%</b><span>Замовлень зі знижкою</span></div>
    <div class="m-stat"><b class="${dAgg.n && dAgg.v > 0 ? 'neg' : ''}">${dAgg.n && dAgg.v > 0 ? '-' : ''}${esc(fmtAgg(dAgg))}</b><span>Віддано на знижках</span></div>

  const my = 156 + 2*(th + 16) + 8, mh = 470, mw = S - 2*M;
  const dpr = 2, snap = await mapSnapshot(dpr), sc = Math.max(mw / snap.W, mh / snap.H), sw = mw / sc, sh = mh / sc;
  x.save(); rr(M, my, mw, mh, 26); x.clip();
  x.drawImage(snap.c, (snap.W - sw) / 2 * dpr, (snap.H - sh) / 2 * dpr, sw * dpr, sh * dpr, M, my, mw, mh); x.restore();
  // top products and regions
  const ly = my + mh + 40, cw = (S - 2*M - 32) / 2;
  const items = new Map(); vis.forEach(e => e.orders.forEach(o => itemsOf(o).forEach(it => { const k = itemKey(it); if (!k) return; const v = items.get(k) || { t:it.t || 'Лістинг', n:0 }; v.n += it.q || 1; items.set(k, v); })));
  const topItems = [...items.values()].sort((a,b) => b.n - a.n).slice(0, 5).map(v => [v.t, v.n + ' шт.']);
  const multi = new Set(vis.map(e => e.place.country)).size > 1, reg = new Map();
  vis.forEach(e => { const k = !multi && isUS(e.place.country) && stateName(e.place.state) ? stateName(e.place.state) : e.place.country || '—'; reg.set(k, (reg.get(k) || 0) + e.orders.length); });
  const topReg = [...reg].sort((a,b) => b[1] - a[1]).slice(0, 5).map(([k, n]) => [k, n + ' зам.']);
  [[topItems.length ? 'Топ товари' : 'Топ міста', topItems.length ? topItems : [...new Map(vis.map(e => [placeKey(e.place), e])).values()].sort((a,b) => b.orders.length - a.orders.length).slice(0, 5).map(e => [e.place.city || '—', e.orders.length + ' зам.'])],
   [multi ? 'Топ країни' : 'Топ штати / регіони', topReg]].forEach(([title, list], col) => {
    const cx = M + col * (cw + 32);
    x.fillStyle = P.card; rr(cx, ly, cw, H - ly - 92, 22); x.fill();
    x.textAlign = 'left'; x.fillStyle = P.mut; x.font = F(700, 19); x.fillText(title.toUpperCase(), cx + 24, ly + 42);
    list.forEach(([name, val], i) => {
      const ry = ly + 86 + i * 50;
      x.fillStyle = '#f1641e'; x.font = F(800, 22); x.fillText(String(i + 1), cx + 24, ry);
      x.fillStyle = P.fg; x.font = F(600, 23); x.fillText(fit(name, cw - 170), cx + 56, ry);
      x.fillStyle = P.mut; x.font = F(600, 21); x.textAlign = 'right'; x.fillText(val, cx + cw - 24, ry); x.textAlign = 'left';
    });
    if (!list.length) { x.fillStyle = P.mut; x.font = F(500, 21); x.fillText('Немає даних', cx + 24, ly + 86); }
  });
  x.fillStyle = P.mut; x.font = F(500, 18); x.textAlign = 'left'; x.fillText(`Карта замовлень Etsy · ${fmtDay(new Date())}`, M, H - 40);
  x.textAlign = 'right'; x.fillText('Tiles © Esri', S - M, H - 40);
  try { c.toBlob(b => { if (!b) return toast('Не вдалося створити звіт.', 4000); download(b, `etsy-report-${om || isoDay(new Date())}.png`); toast('📊 Звіт збережено.', 2500); }, 'image/png'); }
  catch { toast('Браузер заблокував зображення мапи. Спробуйте ще раз після повного завантаження мапи.', 5000); }
}

// ================= backup / restore =================
const BACKUP_APP = 'etsy-orders-geo';
function exportBackup() {
  const data = { app:BACKUP_APP, version:1, exported:new Date().toISOString(), shops: shops.map(s => ({ ...shopMeta(s), places:s.places, ledger:s.ledger || [], reviews:s.reviews || {} })), geo:cache };
  const n = shops.reduce((t,s) => t + nOrders(s), 0);
  download(new Blob([JSON.stringify(data)], { type:'application/json' }), `etsy-map-backup-${isoDay(new Date())}.json`);
  toast(`💾 Збережено ${shops.length} магазин(и), ${n} замовлень. Файл містить імена покупців — зберігайте його приватно.`, 6000);
}
async function restoreBackup(data) {
  if (!Array.isArray(data?.shops) || !data.shops.length) return toast('Це не резервна копія карти замовлень.', 4000);
  const n = data.shops.reduce((t,s) => t + (s.places||[]).reduce((u,p) => u + (p.orders||[]).length, 0), 0);
  if (!confirm(`Відновити дані з копії від ${fmtDate(data.exported)}?\n\nУ копії: ${data.shops.length} магазин(и), ${n} замовлень.\nПоточні магазини й замовлення буде замінено.`)) return;
  for (const s of shops) { await kv.del('data:'+s.id); await kv.del('ledger:'+s.id); await kv.del('reviews:'+s.id); }
  shops = data.shops.map(s => ({ ...s, places: s.places || [], ledger: s.ledger || [], reviews: s.reviews || {}, visible: s.visible !== false, loading:false }));
  for (const s of shops) { s.places.forEach(p => p.key ||= placeKey(p)); computeRepeat(s); await saveData(s); await kv.set('ledger:'+s.id, s.ledger); await kv.set('reviews:'+s.id, s.reviews); }
  if (data.geo) { cache = { ...cache, ...data.geo }; kv.set('geo', cache); }
  activeId = shops[0].id; saveShops(); closeSheet();
  renderShops(); syncUploadLabel(); refresh(true);
  toast(`📥 Відновлено ${shops.length} магазин(и), ${n} замовлень.`, 4000);
}
$('restoreFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { await restoreBackup(JSON.parse(await f.text())); } catch (err) { toast('Не вдалося прочитати файл: ' + err.message, 5000); }
};

// ================= read-only share link (data lives in the URL, compressed) =================
const b64url = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64url = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
const deflate = async str => new Uint8Array(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
const inflate = async u8 => new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
async function smallLogo(src) {
  if (!src) return ''; const im = await loadImg(src); if (!im) return '';
  const c = document.createElement('canvas'); c.width = c.height = 40; c.getContext('2d').drawImage(im, 0, 0, 40, 40); return c.toDataURL('image/png');
}
async function shareLink() {
  if (location.protocol === 'file:') return toast('Посилання працює лише з опублікованої сторінки (GitHub Pages), не з файлу на комп\'ютері.', 5000);
  if (!window.CompressionStream) return toast('Цей браузер не вміє стискати дані для посилання. Спробуйте Chrome, Edge або Safari 16.4+.', 5000);
  const vis = visibleEntries(); if (!vis.length) return toast('Немає замовлень для посилання.', 3000);
  toast('Готую посилання…');
  const curs = [], ci = c => { let i = curs.indexOf(c); if (i < 0) { curs.push(c); i = curs.length - 1; } return i; };
  const out = []; let n = 0;
  for (const s of shops) {
    const mine = vis.filter(e => e.shop === s); if (!mine.length) continue;
    out.push({ n:s.name, c:s.color, l: await smallLogo(s.logo), o: s.origin ? [+s.origin.lat.toFixed(2), +s.origin.lng.toFixed(2), s.origin.q] : null,
      p: mine.map(e => { n += e.orders.length; return [+e.place.lat.toFixed(3), +e.place.lng.toFixed(3), e.place.city||'', e.place.state||'', e.place.country||'',
        e.orders.map(o => { const t = Date.parse(o.date); return [isNaN(t) ? -1 : Math.floor(t / 864e5), o.total != null ? Math.round(o.total * 100) : -1, ci(o.currency||'USD'), o.of > 1 ? 1 : 0]; })]; }) });
  }
  const url = location.origin + location.pathname + '#v=' + b64url(await deflate(JSON.stringify({ v:1, cur:curs, s:out })));
  const warn = url.length > 60000 ? ' Посилання дуже довге — деякі месенджери можуть його обрізати; звузьте період чи країни.' : '';
  try { await navigator.clipboard.writeText(url); toast(`🔗 Посилання скопійовано: ${n} замовлень без імен, номерів і товарів.${warn}`, 7000); }
  catch { toast(''); prompt('Скопіюйте посилання:', url); }
}
async function bootViewer(hash) {
  const data = JSON.parse(await inflate(unb64url(hash)));
  viewOnly = true; privacy = true; document.body.classList.add('viewer');
  shops = data.s.map((s, i) => ({ id:'v'+i, name:s.n, color:s.c, logo:s.l || '', visible:true, loading:false,
    origin: s.o ? { lat:s.o[0], lng:s.o[1], q:s.o[2] } : undefined,
    places: s.p.map(p => ({ lat:p[0], lng:p[1], city:p[2], state:p[3], country:p[4], key:placeKey({ city:p[2], state:p[3], country:p[4] }),
      orders: p[5].map(o => ({ id:'', date: o[0] >= 0 ? new Date(o[0] * 864e5 + 432e5).toISOString() : '', total: o[1] >= 0 ? o[1] / 100 : null, currency: data.cur[o[2]] || 'USD', items:[], itemsCount:null, buyer:'', nth:0, of: o[3] ? 2 : 0 })) })) }));
  activeId = shops[0]?.id;
  $('shopsTitle').textContent = 'Перегляд мапи';
  document.title = shops.map(s => s.name).join(' · ') + ' · Карта замовлень';
}
window.addEventListener('hashchange', () => location.reload());

// ================= loading orders into a shop (merges, no duplicates) =================
const runs = {};
async function loadInto(shop, rows) {
  const run = (runs[shop.id] = (runs[shop.id]||0) + 1);
  if (selected?.shop === shop) closeSheet();
  shop.loading = 'Обробка файлу…'; shop.visible = true; renderShops();
  // 1) rows → orders; rows of the same order (one row per item) are combined
  const incoming = new Map(); let k = 0;
  for (const n of rows.map(normalize)) {
    if (!n.city && !n.country && n.lat == null) continue;
    const key = n.order.id ? 'id:' + n.order.id : 'row:' + (k++);
    const ex = incoming.get(key);
    if (ex) { ex.order.items.push(...n.order.items); ex.order.itemsCount = (ex.order.itemsCount||0) + (n.order.itemsCount||0); if (n.order.itemLevel && n.order.total != null) ex.order.total = (ex.order.total||0) + n.order.total; }
    else incoming.set(key, { loc:n, order:n.order });
  }
  // 2) merge into existing data: same order id → update, same signature without id → skip
  const sig = o => [o.date, o.buyer, o.total].join('|');
  const places = new Map(), byId = new Map(), sigs = new Set();
  shop.places.forEach(p => { p.key ||= placeKey(p); places.set(p.key, p); p.orders.forEach(o => { if (o.id) byId.set(o.id, p); else sigs.add(sig(o)); }); });
  let added = 0, updated = 0, dup = 0;
  for (const { loc, order } of incoming.values()) {
    let pk = placeKey(loc), place = places.get(pk);
    if (!place) { place = { key:pk, city:loc.city, state:loc.state, country:loc.country, zip:loc.zip || '', lat:loc.lat, lng:loc.lng, orders:[] }; places.set(pk, place); }
    else if (loc.zip && !place.zip) { // a postcode arrived for a city placed earlier by name: place it again, more precisely
      place.zip = loc.zip;
      if (place.lat != null && place.geoBy !== 'zip') { place.regeo = [place.lat, place.lng]; place.lat = place.lng = null; }
    }
    if (order.id && byId.has(order.id)) {
      const old = byId.get(order.id), i = old.orders.findIndex(o => o.id === order.id), merged = mergeOrder(old.orders[i], order);
      if (old === place) old.orders[i] = merged; else { old.orders.splice(i, 1); place.orders.push(merged); byId.set(order.id, place); }
      updated++;
    } else if (!order.id && sigs.has(sig(order))) dup++;
    else { place.orders.push(order); if (order.id) byId.set(order.id, place); added++; }
  }
  shop.places = [...places.values()].filter(p => p.orders.length);
  computeRepeat(shop); refresh(false);
  // 3) geocode new cities
  const todo = shop.places.filter(p => p.lat == null);
  for (let i = 0; i < todo.length; i++) {
    if (runs[shop.id] !== run) return;
    const p = todo[i]; shop.loading = `${p.zip ? 'Уточнюю піни за індексом' : 'Шукаю міста на мапі'} ${i+1}/${todo.length}…`; renderShops();
    const c = await geocode(p); if (c) { p.lat = c[0]; p.lng = c[1]; } else if (p.regeo) { [p.lat, p.lng] = p.regeo; }
    delete p.regeo;
    if (i % 3 === 0 || i === todo.length-1) redraw(false);
  }
  if (runs[shop.id] !== run) { shop.places.forEach(p => { if (p.lat == null && p.regeo) { [p.lat, p.lng] = p.regeo; delete p.regeo; } }); return; }
  const lost = shop.places.filter(p => p.lat == null); const unplaced = lost.reduce((s,p) => s + p.orders.length, 0);
  shop.places = shop.places.filter(p => p.lat != null);
  applyReviews(shop); computeRepeat(shop); shop.loading = false; await saveData(shop);
  const parts = [`+${added} нових`]; if (updated) parts.push(`${updated} оновлено`); if (dup) parts.push(`${dup} дублів пропущено`); if (unplaced) parts.push(`${unplaced} не знайдено на мапі`);
  toast(`«${shop.name}»: ${parts.join(', ')}.`, 6000);
  renderShops(); refresh(true);
}
async function loadFile(f) {
  if (viewOnly) return;
  const t = await f.text(); let data;
  try { data = f.name.toLowerCase().endsWith('.json') ? JSON.parse(t) : parseCSV(t); } catch (e) { return toast('Не вдалося прочитати файл: ' + e.message, 5000); }
  if (data && !Array.isArray(data) && data.app === BACKUP_APP) return restoreBackup(data);
  if (!Array.isArray(data) || !data.length) return toast('У файлі немає замовлень.', 4000);
  if (isStatement(data)) return loadLedger(activeShop(), data);
  if (isReviews(data)) return loadReviews(activeShop(), data);
  return loadInto(activeShop(), data);
}
// several files at once (e.g. Sold Orders + Sold Order Items + statements): one after another,
// so each merges into the result of the previous one and cities are geocoded once
let fileQueue = Promise.resolve();
function loadFiles(list) {
  const files = [...(list || [])].filter(f => /\.(csv|json)$/i.test(f.name));
  if (!files.length) return list?.length && toast('Підходять лише файли .csv або .json.', 4000);
  files.forEach((f, i) => { fileQueue = fileQueue.then(() => { if (files.length > 1) toast(`Файл ${i+1} з ${files.length}: ${f.name}`, 2500); return loadFile(f); }).catch(e => toast('Помилка у файлі ' + f.name + ': ' + e.message, 5000)); });
}
$('file').onchange = e => { loadFiles(e.target.files); e.target.value=''; };
document.body.ondragover = e => { e.preventDefault(); if (!viewOnly && [...(e.dataTransfer?.types || [])].includes('Files')) document.body.classList.add('drop'); };
document.body.ondragleave = e => { if (!e.relatedTarget) document.body.classList.remove('drop'); };
document.body.ondrop = e => { e.preventDefault(); document.body.classList.remove('drop'); loadFiles(e.dataTransfer.files); };
$('clear').onclick = () => { cache = {}; kv.set('geo', cache); toast('Кеш геокодингу очищено.', 2000); };

// ================= instant tooltips: any element with data-tip =================
const tipEl = document.createElement('div'); tipEl.id = 'tip'; document.body.appendChild(tipEl);
const hideTip = () => tipEl.classList.remove('show');
document.addEventListener('mouseover', e => {
  const t = e.target.closest?.('[data-tip]'); if (!t) return hideTip();
  tipEl.textContent = t.dataset.tip; tipEl.classList.add('show');
  const r = t.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(6, Math.min(innerWidth - w - 6, r.left + r.width / 2 - w / 2)) + 'px';
  tipEl.style.top = (r.top - h - 6 < 6 ? r.bottom + 6 : r.top - h - 6) + 'px';
});

document.addEventListener('mouseleave', hideTip);

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

  if (installEvt) { installEvt.prompt(); const r = await installEvt.userChoice.catch(() => null); installEvt = null; if (r?.outcome === 'accepted') toast('Готово! Іконка з\'явиться серед застосунків.', 4000); return; }
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const safari = /Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(ua);

}

// data imported before entity decoding existed: fix it in place; returns true when something changed
function cleanEntities(s) {
  let ch = false; const fx = (o, k) => { const v = unent(o[k]); if (v !== o[k]) { o[k] = v; ch = true; } };
  s.places.forEach(p => { const c0 = p.city; fx(p, 'city'); if (p.city !== c0) p.key = placeKey(p); p.orders.forEach(o => { ['buyer','couponInfo','coupon'].forEach(k => fx(o, k)); (o.items || []).forEach(it => { if (typeof it === 'object') { fx(it, 't'); fx(it, 'v'); } }); if (o.review) { fx(o.review, 'm'); fx(o.review, 'by'); } }); });
  Object.values(s.reviews || {}).forEach(r => { fx(r, 'm'); fx(r, 'by'); });
  (s.ledger || []).forEach(r => { fx(r, 'title'); fx(r, 'info'); });
  return ch;
}

// ================= boot =================
(async function boot() {
  const hash = location.hash.startsWith('#v=') ? location.hash.slice(3) : '';
  if (hash) {
    try { await bootViewer(hash); }
    catch { toast('Посилання пошкоджене або обрізане. Попросіть автора надіслати його ще раз.', 8000); viewOnly = true; document.body.classList.add('viewer'); shops = []; }
  } else {
    let meta = await kv.get('shops');
    if (!meta) { // move data from the older localStorage format into IndexedDB
      let old = null; try { old = JSON.parse(ls.get('etsyShops') || 'null'); } catch {}
      if (old?.length) {
        let ok = true;
        for (const s of old) { let d = []; try { d = JSON.parse(ls.get('etsyShopData:'+s.id) || '[]'); } catch {} ok = (await kv.set('data:'+s.id, d)) && ok; }
        try { const g = JSON.parse(ls.get('etsyGeoCache') || 'null'); if (g) ok = (await kv.set('geo', g)) && ok; } catch {}
        ok = (await kv.set('shops', old)) && ok;
        if (ok) ['etsyShops','etsyGeoCache','etsyBrand', ...old.map(s => 'etsyShopData:'+s.id)].forEach(ls.del);
        meta = old;
      }
    }
    if (!meta?.length) {
      let b = {}; try { b = JSON.parse(ls.get('etsyBrand') || '{}'); } catch {}
      meta = [{ id:uid(), name:b.name || 'Мій Etsy-магазин', logo:b.logo || '', color:COLORS[0], visible:true }];
    }
    shops = meta;
    for (const s of shops) { s.places = (await kv.get('data:'+s.id)) || []; s.ledger = (await kv.get('ledger:'+s.id)) || []; s.reviews = (await kv.get('reviews:'+s.id)) || {}; if (cleanEntities(s)) { saveData(s); kv.set('reviews:'+s.id, s.reviews); } s.visible = s.visible !== false; s.loading = false; s.places.forEach(p => p.key ||= placeKey(p)); computeRepeat(s); }
    cache = (await kv.get('geo')) || {};
    activeId = shops[0].id; saveShops();
  }
  if (dispCur && !await loadRates()) { dispCur = ''; }
  syncTopButtons(); renderShops(); syncUploadLabel(); renderRangeUI(); renderCurUI(); refresh(true);
})();
